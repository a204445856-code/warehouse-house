<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📦 مستودع البيت</title>

<style>
body{margin:0;font-family:Tahoma;background:#f6f7fb}
header{background:#fff;padding:14px;border-bottom:1px solid #ddd}
main{padding:16px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:12px;padding:14px;border:1px solid #ddd;margin-bottom:16px}
input,select,textarea,button{
  width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:6px
}
button{cursor:pointer;font-weight:bold;background:#2563eb;color:#fff}
.row{display:grid;gap:10px}
@media(min-width:600px){.row{grid-template-columns:1fr 1fr}}
.item{display:flex;gap:10px;align-items:center;border:1px solid #ddd;padding:10px;border-radius:10px;margin-top:10px}
img{width:50px;height:50px;border-radius:8px;object-fit:cover}
.danger{background:#ef4444}
</style>
</head>

<body>
<header><h2>📦 مستودع البيت</h2></header>

<main>

<div class="card">
<h3>إضافة غرض</h3>

<input type="hidden" id="editIndex">

<label>اسم الغرض *</label>
<input id="name">

<label>التصنيف</label>
<select id="category">
  <option value="">اختر</option>
  <option>أدوات</option>
  <option>كهرباء</option>
  <option>مطبخ</option>
  <option>تنظيف</option>
</select>

<div class="row">
  <div>
    <label>رقم الرف</label>
    <select id="shelf"></select>
  </div>
  <div>
    <label>الجهة</label>
    <select id="side">
      <option value="">اختر</option>
      <option>يمين</option>
      <option>يسار</option>
      <option>وسط</option>
    </select>
  </div>
</div>

<div class="row">
  <div>
    <label>المستوى</label>
    <select id="level">
      <option value="">اختر</option>
      <option>علوي</option>
      <option>متوسط</option>
      <option>سفلي</option>
    </select>
  </div>
  <div>
    <label>المنطقة</label>
    <select id="zone">
      <option value="">اختر</option>
      <option>البيت</option>
      <option>الملحق</option>
      <option>الكراج</option>
      <option>المخزن</option>
    </select>
  </div>
</div>

<label>ملاحظات</label>
<textarea id="notes"></textarea>

<label>صورة</label>
<input type="file" id="image" accept="image/*">

<button onclick="save()">💾 حفظ</button>
</div>

<div class="card">
<h3>العرض</h3>
<div id="list"></div>
</div>

</main>

<script>
/* ========= إعداد الربط مع Google Sheets ========= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIeQj-UTxhaJ27mdcaOkZH2g7l5tu13_cDuyCWu4FLEoXCiacgiL6AtOCaYVyJvdLp/exec";

/* ========= أدوات ========= */
const el = id => document.getElementById(id);
const nameEl=el("name"),catEl=el("category"),shelfEl=el("shelf"),
sideEl=el("side"),levelEl=el("level"),zoneEl=el("zone"),
notesEl=el("notes"),imageEl=el("image"),
editIndexEl=el("editIndex"),listEl=el("list");

function uid(){
  return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
}

/* ========= توليد 50 رف ========= */
shelfEl.innerHTML='<option value="">اختر</option>';
for(let i=1;i<=50;i++){
  shelfEl.innerHTML+=`<option>${i}</option>`;
}

/* ========= API ========= */
async function apiGet(){
  const r=await fetch(SCRIPT_URL);
  return await r.json();
}
async function apiPost(payload){
  const r=await fetch(SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  return await r.json();
}

/* ========= البيانات ========= */
let items=[];

async function load(){
  try{
    const d=await apiGet();
    items=d.items||[];
    localStorage.setItem("warehouse_items",JSON.stringify(items));
  }catch{
    items=JSON.parse(localStorage.getItem("warehouse_items")||"[]");
  }
  render();
}

/* ========= حفظ ========= */
function save(){
  if(!nameEl.value) return alert("اسم الغرض مطلوب");

  const obj={
    id: editIndexEl.value==="" ? uid() : items[editIndexEl.value].id,
    name:nameEl.value,
    category:catEl.value,
    shelf:shelfEl.value,
    side:sideEl.value,
    level:levelEl.value,
    zone:zoneEl.value,
    notes:notesEl.value,
    date:new Date().toLocaleString("ar-SA"),
    image:""
  };

  const file=imageEl.files[0];
  if(file){
    const r=new FileReader();
    r.onload=e=>{obj.image=e.target.result;finish(obj)};
    r.readAsDataURL(file);
  }else finish(obj);
}

function finish(obj){
  const idx=editIndexEl.value;
  if(idx==="") items.push(obj);
  else items[idx]=obj;

  localStorage.setItem("warehouse_items",JSON.stringify(items));
  apiPost({item:obj}).catch(()=>alert("لم يتم الرفع للسحابة"));
  clearForm(); render();
}

/* ========= عرض ========= */
function render(){
  listEl.innerHTML="";
  items.forEach((i,idx)=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      <img src="${i.image||'https://via.placeholder.com/50'}">
      <div>
        <b>${i.name}</b><br>
        رف ${i.shelf} - ${i.side} - ${i.level}<br>
        ${i.category} / ${i.zone}
      </div>
      <button class="danger" onclick="delItem(${idx})">🗑️</button>`;
    listEl.appendChild(d);
  });
}

/* ========= حذف ========= */
function delItem(i){
  const id=items[i].id;
  items.splice(i,1);
  localStorage.setItem("warehouse_items",JSON.stringify(items));
  render();
  apiPost({action:"delete",item:{id}});
}

/* ========= تنظيف ========= */
function clearForm(){
  [nameEl,catEl,shelfEl,sideEl,levelEl,zoneEl,notesEl,imageEl].forEach(e=>e.value="");
  editIndexEl.value="";
}

load();
</script>

</body>
</html>
