<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
body {
  font-family: Tahoma, Arial;
  background:#f4f6f8;
  margin:0;
}
header {
  background:#1f2937;
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:20px;
}
.container {
  padding:15px;
}
.card {
  background:#fff;
  border-radius:10px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
input, select, textarea, button {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:15px;
}
button {
  background:#2563eb;
  color:#fff;
  border:none;
}
.list-item {
  border-bottom:1px solid #eee;
  padding:10px 0;
}
.list-item:last-child {
  border:none;
}
img {
  max-width:100%;
  border-radius:8px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

<div class="card">
<h3>إضافة غرض</h3>

<input id="name" placeholder="اسم الغرض">
<input id="category" placeholder="التصنيف">
<input id="shelf" placeholder="رقم الرف">
<input id="level" placeholder="المستوى">
<textarea id="notes" placeholder="ملاحظات"></textarea>
<input type="file" id="image">

<button onclick="saveItem()">حفظ</button>
</div>

<div class="card">
<h3>📋 الأغراض المحفوظة</h3>
<div id="items"></div>
</div>

</div>

<script>
// 🔗 رابط Web App (تم وضعه لك)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJ7wvRp76cZOVLDwA7aLyVPNelcwQEmYQLIitrbH8OCFl9550n03MO6IsPKz_-7k6T/exec";

async function saveItem() {
  const fd = new FormData();
  fd.append("action", "add");
  fd.append("name", name.value);
  fd.append("category", category.value);
  fd.append("shelf", shelf.value);
  fd.append("level", level.value);
  fd.append("notes", notes.value);
  if (image.files[0]) fd.append("image", image.files[0]);

  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: fd
  });

  const json = await res.json();

  if (json.status === "success") {
    alert("تم الحفظ بنجاح");
    name.value = category.value = shelf.value = level.value = notes.value = "";
    image.value = "";
    loadItems();
  } else {
    alert("حدث خطأ");
  }
}

async function loadItems() {
  const res = await fetch(SCRIPT_URL + "?action=list");
  const data = await res.json();

  items.innerHTML = "";
  data.forEach(i => {
    items.innerHTML += `
      <div class="list-item">
        <b>${i.name}</b><br>
        ${i.category || ""} | رف ${i.shelf || ""}<br>
        ${i.notes || ""}
        ${i.image ? `<img src="${i.image}">` : ""}
      </div>
    `;
  });
}

// تحميل البيانات عند فتح الصفحة
loadItems();
</script>

</body>
</html>
