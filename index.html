<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📦 مستودع البيت</title>

<style>
body{
  margin:0;
  font-family:Tahoma, Arial;
  background:#f6f7fb;
}
header{
  background:#fff;
  padding:12px;
  border-bottom:1px solid #ddd;
}
main{
  max-width:1100px;
  margin:auto;
  padding:16px;
}
.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin-bottom:16px;
}
h2{margin-top:0}

input, select, textarea, button{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  cursor:pointer;
  border:none;
  font-weight:bold;
}

.save{background:#2563eb;color:#fff}
.clear{background:#9ca3af;color:#fff}
.reload{background:#111827;color:#fff}

.item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:8px;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.edit{
  background:#f59e0b;
  color:#fff;
  font-size:12px;
  padding:6px;
  border-radius:6px;
}

.delete{
  background:#ef4444;
  color:#fff;
  font-size:12px;
  padding:6px;
  border-radius:6px;
}
</style>
</head>

<body>
<header>
<h1>📦 مستودع البيت</h1>
</header>

<main>

<div class="card">
<h2>إضافة غرض</h2>

<input id="name" placeholder="اسم الغرض *">
<input id="category" placeholder="التصنيف">

<select id="shelf"></select>

<select id="side">
  <option value="">الجهة</option>
  <option>يمين</option>
  <option>يسار</option>
</select>

<select id="level">
  <option value="">المستوى</option>
  <option>علوي</option>
  <option>وسط</option>
  <option>سفلي</option>
</select>

<textarea id="notes" placeholder="ملاحظات"></textarea>

<input id="image" type="file" accept="image/*">

<button class="save" onclick="save()">💾 حفظ</button>
<button class="reload" onclick="load()">🔄 تحديث من السحابة</button>
<button class="clear" onclick="clearForm()">مسح</button>
</div>

<div class="card">
<h2>العرض</h2>
<div id="list"></div>
</div>

</main>

<script>
/* 🔴 ضع رابط السكربت هنا (اللي أرسلته آخر مرة) */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxr-KERLIww6mrFGgRuXBNfrmFTeDA_JNs_syEwXzT-c7nXzCREcTZYty6vSxZG4gOb/exec";

let items = [];
let editId = null;

/* توليد الرفوف 1–50 */
const shelfSel = document.getElementById("shelf");
shelfSel.innerHTML = '<option value="">رقم الرف</option>';
for(let i=1;i<=50;i++){
  shelfSel.innerHTML += `<option>${i}</option>`;
}

/* 🟢 GET */
async function load(){
  const res = await fetch(SCRIPT_URL);
  const data = await res.json();
  items = data.items || [];
  render();
}

/* 🟢 POST (حل مشكلة iPhone / Safari) */
async function apiPost(payload){
  const body = new URLSearchParams();
  body.set("payload", JSON.stringify(payload));

  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
    },
    body
  });
  return await res.json();
}

/* ضغط الصورة */
function compressImage(file){
  return new Promise(resolve=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{
      img.onload = ()=>{
        const canvas = document.createElement("canvas");
        const max = 1000;
        let w = img.width, h = img.height;
        if(w > max){ h *= max/w; w = max; }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function save(){
  if(!name.value.trim()){
    alert("اسم الغرض مطلوب");
    return;
  }

  const obj = {
    id: editId || Date.now().toString(),
    name: name.value,
    category: category.value,
    shelf: shelf.value,
    side: side.value,
    level: level.value,
    notes: notes.value
  };

  try{
    if(image.files[0]){
      obj.image_base64 = await compressImage(image.files[0]);
    }
    await apiPost({ action:"upsert", item:obj });
    clearForm();
    load();
  }catch(e){
    alert("⚠️ لم يرسل للسحابة");
  }
}

function render(){
  list.innerHTML="";
  items.forEach(i=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      <div>
        <b>${i.name}</b><br>
        رف ${i.shelf || "-"} / ${i.side || "-"} / ${i.level || "-"}
      </div>
      <div class="actions">
        <button class="edit" onclick="edit('${i.id}')">تعديل</button>
        <button class="delete" onclick="del('${i.id}')">حذف</button>
      </div>
    `;
    list.appendChild(d);
  });
}

function edit(id){
  const o = items.find(x=>x.id==id);
  if(!o) return;
  editId=id;
  name.value=o.name;
  category.value=o.category;
  shelf.value=o.shelf;
  side.value=o.side;
  level.value=o.level;
  notes.value=o.notes;
}

async function del(id){
  if(!confirm("حذف الغرض؟")) return;
  await apiPost({ action:"delete", item:{id} });
  load();
}

function clearForm(){
  document.querySelectorAll("input,select,textarea").forEach(e=>e.value="");
  editId=null;
}

load();
</script>
</body>
</html>
