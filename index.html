<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>

<style>
body {
  direction: rtl;
  font-family: Arial;
  background: #f3f3f3;
  margin: 0;
}
h2 {
  text-align: center;
  padding: 15px;
}
.container {
  display: flex;
  gap: 20px;
  padding: 20px;
}
.left, .right {
  background: #fff;
  padding: 15px;
  border-radius: 8px;
}
.left {
  width: 30%;
}
.right {
  width: 70%;
}
ul {
  list-style: none;
  padding: 0;
}
li {
  padding: 8px;
  border-bottom: 1px solid #ddd;
  cursor: pointer;
}
li:hover {
  background: #f0f0f0;
}
input, textarea {
  width: 100%;
  padding: 6px;
  margin: 5px 0;
}
button {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  background: #2563eb;
  color: #fff;
  cursor: pointer;
}
img {
  max-width: 100%;
  margin-top: 10px;
  border-radius: 6px;
}
.label {
  font-weight: bold;
  margin-top: 6px;
}
</style>
</head>

<body>

<h2>📦 مستودع البيت</h2>

<div class="container">

  <!-- القائمة -->
  <div class="left">
    <h3>الأغراض</h3>
    <ul id="itemsList"></ul>
  </div>

  <!-- التفاصيل -->
  <div class="right">
    <h3 id="itemName">اختر غرضًا</h3>

    <div class="label">التصنيف:</div>
    <div id="itemCategory"></div>

    <div class="label">المكان:</div>
    <div id="itemLocation"></div>

    <div class="label">ملاحظات:</div>
    <div id="itemNotes"></div>

    <img id="itemImage" style="display:none;">
  </div>

</div>

<script>
const scriptURL =
"https://script.google.com/macros/s/AKfycbxqbICXqRgJ7OT8WFQH9cd-6lFN75vONOR-Fzrf87w2Mt_g1dBfkZhZ6UPyvbSrAZ49/exec";

let allItems = [];

function loadItems() {
  fetch(scriptURL)
    .then(r => r.json())
    .then(data => {
      allItems = data;
      itemsList.innerHTML = "";
      data.forEach((item, index) => {
        const li = document.createElement("li");
        li.textContent = item.name;
        li.onclick = () => showItem(index);
        itemsList.appendChild(li);
      });
    });
}

function showItem(index) {
  const item = allItems[index];

  itemName.textContent = item.name;
  itemCategory.textContent = item.category || "-";
  itemLocation.textContent =
    `رف ${item.shelf} – ${item.zone}`;
  itemNotes.textContent = item.notes || "-";

  if (item.image_url) {
    itemImage.src = item.image_url;
    itemImage.style.display = "block";
  } else {
    itemImage.style.display = "none";
  }
}

loadItems();
</script>

</body>
</html>
