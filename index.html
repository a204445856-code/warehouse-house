<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{margin:0;background:#f3f4f6}
header{
  background:#fff;
  padding:15px 25px;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #e5e7eb
}
.container{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:20px;
  padding:20px
}
.card{
  background:#fff;
  border-radius:10px;
  padding:20px;
  box-shadow:0 1px 4px rgba(0,0,0,.08)
}

/* القائمة */
.search{margin-bottom:15px}
.search input{
  width:100%;padding:10px;border:1px solid #ddd;border-radius:8px
}
.item{
  display:flex;gap:12px;align-items:center;
  padding:10px;border:1px solid #eee;
  border-radius:10px;margin-bottom:10px
}
.item img{
  width:60px;height:60px;object-fit:cover;
  border-radius:8px;background:#eee
}
.item-info{flex:1}
.item-info b{display:block;margin-bottom:4px}
.item-actions{
  display:flex;flex-direction:column;gap:6px
}
.item-actions button{
  border:none;padding:6px 10px;border-radius:6px;
  cursor:pointer;color:#fff;font-size:13px
}
.edit{background:#f59e0b}
.delete{background:#ef4444}

/* النموذج */
label{font-size:13px;color:#374151;margin-top:10px;display:block}
input,select,textarea{
  width:100%;padding:10px;margin-top:5px;
  border:1px solid #ddd;border-radius:8px
}
textarea{resize:none;height:80px}
.buttons{display:flex;gap:10px;margin-top:15px}
.save{background:#2563eb;color:#fff;border:none;padding:10px;border-radius:8px;flex:1}
.clear{background:#9ca3af;color:#fff;border:none;padding:10px;border-radius:8px;flex:1}
.sync{background:#111827;color:#fff;border:none;padding:10px;border-radius:8px;flex:1}
.note{margin-top:10px;font-size:12px;color:#6b7280}

@media(max-width:900px){
  .container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

<!-- القائمة -->
<div class="card">
  <div class="search">
    <input id="searchInput" placeholder="ابحث بالاسم" oninput="searchByName()">
  </div>
  <div id="items">جاري التحميل...</div>
</div>

<!-- الإدخال -->
<div class="card">
  <form id="itemForm"
    action="https://script.google.com/macros/s/AKfycbxST_WcgWG8mAKONieRUQhIj_fgwYQxkOHvhQx8wCJJ42-r2LM8e-24_8BS2k1vfpA/exec"
    method="POST"
    enctype="multipart/form-data"
    target="hiddenFrame"
    onsubmit="afterSubmit()">

    <label>اسم الغرض *</label>
    <input name="name" id="itemName" required>

    <label>التصنيف</label>
    <input name="category">

    <label>رقم الرف</label>
    <input name="shelf">

    <label>المستوى</label>
    <input name="level">

    <label>ملاحظات</label>
    <textarea name="notes"></textarea>

    <label>صورة</label>
    <input type="file" name="image" accept="image/*">

    <div class="buttons">
      <button class="save" type="submit">حفظ</button>
      <button class="clear" type="reset">مسح الحقول</button>
      <button class="sync" type="button" onclick="loadItems()">تحديث من السحابة</button>
    </div>

    <div class="note">
      التخزين يتم في Google Sheets + الصور في Google Drive
    </div>
  </form>

  <iframe name="hiddenFrame" style="display:none"></iframe>
</div>

</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxST_WcgWG8mAKONieRUQhIj_fgwYQxkOHvhQx8wCJJ42-r2LM8e-24_8BS2k1vfpA/exec";

let ITEMS=[];

function afterSubmit(){
  setTimeout(()=>{
    itemForm.reset();
    loadItems();
  },1500);
}

async function loadItems(){
  const r=await fetch(SCRIPT_URL+"?action=list");
  ITEMS=await r.json();
  renderItems(ITEMS);
}

function renderItems(arr){
  items.innerHTML="";
  if(!arr.length){
    items.innerHTML="لا توجد عناصر";
    return;
  }
  arr.forEach((i,idx)=>{
    items.innerHTML+=`
      <div class="item">
        ${i.image?`<img src="${i.image}">`:`<img>`}
        <div class="item-info">
          <b>${i.name}</b>
          رف - ${i.shelf||"-"}
        </div>
        <div class="item-actions">
          <button class="edit" onclick="fillForm(${idx})">تعديل</button>
        </div>
      </div>
    `;
  });
}

function fillForm(i){
  const d=ITEMS[i];
  itemName.value=d.name;
  document.querySelector('[name=category]').value=d.category||"";
  document.querySelector('[name=shelf]').value=d.shelf||"";
  document.querySelector('[name=level]').value=d.level||"";
  document.querySelector('[name=notes]').value=d.notes||"";
}

function searchByName(){
  const q=searchInput.value.trim();
  renderItems(q?ITEMS.filter(i=>i.name.includes(q)):ITEMS);
}

loadItems();
</script>

</body>
</html>
