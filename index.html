<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>اختبار Firebase</title>
</head>
<body>

  <h2>رفع صورة (اختبار)</h2>

  <input type="file" id="image">
  <br><br>
  <button onclick="upload()">رفع الصورة</button>

  <p id="result"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
      authDomain: "warehouse-house.firebaseapp.com",
      projectId: "warehouse-house",
      storageBucket: "warehouse-house.appspot.com",
      messagingSenderId: "791378856906",
      appId: "1:791378856906:web:69aa95b1c53e2791865d33"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    window.upload = async function () {
      const file = document.getElementById("image").files[0];
      if (!file) {
        alert("اختر صورة أولًا");
        return;
      }

      const imageRef = ref(storage, "images/" + Date.now() + "_" + file.name);
      await uploadBytes(imageRef, file);
      const url = await getDownloadURL(imageRef);

      document.getElementById("result").innerText =
        "تم رفع الصورة ✅\nالرابط:\n" + url;
    };
  </script>

</body>
</html>
