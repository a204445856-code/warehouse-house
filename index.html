<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>

<style>
body {
  font-family: Tahoma;
  background: #f5f5f5;
  margin: 20px;
}
.container {
  display: flex;
  gap: 20px;
}
.form, .list {
  background: white;
  padding: 15px;
  border-radius: 8px;
  width: 50%;
}
input, select, textarea, button {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
}
.item {
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid #ddd;
  padding: 8px 0;
}
.item img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  cursor: pointer;
}
.delete {
  background: red;
  color: white;
  border: none;
  padding: 5px;
}
</style>
</head>

<body>

<h2>📦 مستودع البيت</h2>

<div class="container">

<div class="form">
<h3>إضافة غرض</h3>

<input id="name" placeholder="اسم الغرض">

<select id="shelf"></select>

<select id="place">
  <option value="">اختر المكان</option>
  <option>البدروم</option>
  <option>المطبخ</option>
  <option>غرفة البنات</option>
  <option>غرفة الأولاد</option>
  <option>الصالة</option>
  <option>تحت المغسلة</option>
  <option>غرفتي</option>
  <option>استقبال</option>
  <option>استقبال البيت</option>
</select>

<textarea id="notes" placeholder="ملاحظات"></textarea>

<input type="file" id="image">

<button onclick="saveItem()">💾 حفظ</button>
</div>

<div class="list">
<h3>المحتويات</h3>
<div id="items"></div>
</div>

</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
  authDomain: "warehouse-house.firebaseapp.com",
  projectId: "warehouse-house",
  storageBucket: "warehouse-house.firebasestorage.app",
  messagingSenderId: "791378856906",
  appId: "1:791378856906:web:69aa95b1c53e2791865d33"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// تعبئة الرفوف
const shelfSelect = document.getElementById("shelf");
shelfSelect.innerHTML = `<option value="">رقم الرف</option>`;
for (let i = 1; i <= 100; i++) {
  shelfSelect.innerHTML += `<option>${i}</option>`;
}

// حفظ
window.saveItem = async () => {
  const name = name.value;
  const shelf = shelfSelect.value;
  const place = place.value;
  const notes = notes.value;
  const file = image.files[0];

  if (!name || !shelf) {
    alert("اسم الغرض ورقم الرف مطلوبين");
    return;
  }

  let imageUrl = "";

  if (file) {
    const imgRef = ref(storage, "images/" + Date.now() + file.name);
    await uploadBytes(imgRef, file);
    imageUrl = await getDownloadURL(imgRef);
  }

  await addDoc(collection(db, "items"), {
    name, shelf, place, notes, imageUrl
  });

  alert("✅ تم الحفظ");
  loadItems();
};

// عرض
async function loadItems() {
  items.innerHTML = "";
  const query = await getDocs(collection(db, "items"));
  query.forEach(d => {
    const x = d.data();
    items.innerHTML += `
      <div class="item">
        <img src="${x.imageUrl || ''}" onclick="alert(
          'الاسم: ${x.name}\\nالرف: ${x.shelf}\\nالمكان: ${x.place}\\n${x.notes}'
        )">
        <div>
          <b>${x.name}</b><br>
          رف ${x.shelf} - ${x.place}
        </div>
        <button class="delete" onclick="deleteItem('${d.id}')">حذف</button>
      </div>
    `;
  });
}

// حذف
window.deleteItem = async (id) => {
  if (confirm("حذف العنصر؟")) {
    await deleteDoc(doc(db, "items", id));
    loadItems();
  }
};

loadItems();
</script>

</body>
</html>
