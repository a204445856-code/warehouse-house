<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>

<style>
body{
  font-family: Tahoma, Arial;
  background:#f5f6f8;
  margin:0;
  padding:20px;
}

h1{
  margin-bottom:15px;
}

.container{
  display:grid;
  grid-template-columns: 1fr 1.2fr;
  gap:20px;
}

/* القائمة */
.list{
  background:#fff;
  border-radius:10px;
  padding:15px;
}

.search{
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:6px;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border:1px solid #eee;
  border-radius:8px;
  margin-bottom:10px;
}

.item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid #ccc;
}

.buttons button{
  margin-left:5px;
  padding:6px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.edit{background:#f59e0b;color:#fff;}
.delete{background:#ef4444;color:#fff;}

/* النموذج */
.form{
  background:#fff;
  border-radius:10px;
  padding:15px;
}

.form label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

.form input, .form textarea{
  width:100%;
  padding:8px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:6px;
}

.form-buttons{
  margin-top:15px;
}

.save{
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.clear{
  background:#9ca3af;
  color:#fff;
  padding:10px 15px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.note{
  margin-top:10px;
  color:#555;
  font-size:13px;
}
</style>
</head>

<body>

<h1>📦 مستودع البيت</h1>

<div class="container">

  <!-- القائمة -->
  <div class="list">
    <input class="search" placeholder="ابحث بالاسم أو رقم الرف">

    <div class="item">
      <div>
        <strong>ddgdg</strong><br>
        رف - 8
      </div>
      <div>
        <img src="">
        <div class="buttons">
          <button class="edit">تعديل</button>
          <button class="delete">حذف</button>
        </div>
      </div>
    </div>

  </div>

  <!-- النموذج -->
  <div class="form">
    <label>اسم الغرض *</label>
    <input id="name">

    <label>التصنيف (اختياري)</label>
    <input id="category">

    <label>رقم الرف *</label>
    <input id="shelf">

    <label>المكان</label>
    <input id="location">

    <label>ملاحظات</label>
    <textarea id="notes"></textarea>

    <label>صورة (اختياري)</label>
    <input type="file" id="image">

    <div class="form-buttons">
      <button class="save" onclick="saveItem()">حفظ</button>
      <button class="clear" onclick="clearForm()">مسح الحقول</button>
    </div>

    <div class="note">
      التخزين يتم في Firebase (الصور + البيانات)
    </div>
  </div>

</div>

<script>
function clearForm(){
  document.querySelectorAll("input, textarea").forEach(el=>{
    if(el.type !== "file") el.value="";
  });
}

function saveItem(){
  alert("الواجهة جاهزة ✅\nالخطوة القادمة: ربط Firebase بالكامل");
}
</script>

</body>
</html>
