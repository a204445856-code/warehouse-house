<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Warehouse House</title>
</head>
<body>

  <h2>إضافة غرض</h2>

  <input type="text" id="name" placeholder="اسم الغرض"><br><br>

  <input type="file" id="image"><br><br>

  <button onclick="submitForm()">حفظ</button>

  <!-- ================= Firebase ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // ✅ firebaseConfig الصحيح
    const firebaseConfig = {
      apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
      authDomain: "warehouse-house.firebaseapp.com",
      projectId: "warehouse-house",
      storageBucket: "warehouse-house.appspot.com",
      messagingSenderId: "791378856906",
      appId: "1:791378856906:web:69aa95b1c53e2791865d33"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    // رفع الصورة إلى Firebase Storage
    window.uploadImageToFirebase = async function (file) {
      const imageRef = ref(
        storage,
        "images/" + Date.now() + "_" + file.name
      );
      await uploadBytes(imageRef, file);
      return await getDownloadURL(imageRef);
    };
  </script>

  <!-- ================= إرسال البيانات إلى Google Sheet ================= -->
  <script>
    async function submitForm() {
      const name = document.getElementById("name").value;
      const file = document.getElementById("image").files[0];

      if (!name || !file) {
        alert("الرجاء إدخال الاسم واختيار صورة");
        return;
      }

      // 1️⃣ رفع الصورة
      const imageUrl = await uploadImageToFirebase(file);

      // 2️⃣ إرسال البيانات إلى Google Apps Script
      fetch("PUT_YOUR_GOOGLE_SCRIPT_URL", {
        method: "POST",
        body: JSON.stringify({
          name: name,
          image: imageUrl
        })
      })
      .then(() => alert("تم الحفظ بنجاح ✅"))
      .catch(() => alert("حدث خطأ ❌"));
    }
  </script>

</body>
</html>
