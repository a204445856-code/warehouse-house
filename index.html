<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>إدارة المستودع</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #f5f5f5;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .form-container {
      background: #fff;
      padding: 20px;
      max-width: 500px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, textarea, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      font-size: 14px;
    }
    button {
      background: #2e86de;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #1b4f72;
    }
  </style>
</head>
<body>

  <h1>نظام إدارة المستودع</h1>

  <div class="form-container">
    <label>اسم الصنف</label>
    <input type="text" id="name">

    <label>الفئة</label>
    <input type="text" id="category">

    <label>الرف</label>
    <input type="text" id="shelf">

    <label>الدور</label>
    <input type="text" id="floor">

    <label>المنطقة</label>
    <input type="text" id="area">

    <label>ملاحظات</label>
    <textarea id="notes"></textarea>

    <button onclick="saveItem()">حفظ</button>
  </div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxkCtxsn6NTZdLu-pslaKK3wfxC8rAD00RuCl_NF0Yq58zY73nYOw-2marle2tmJ8Pw/exec";

function saveItem() {
  const data = {
    name: document.getElementById("name").value,
    category: document.getElementById("category").value,
    shelf: document.getElementById("shelf").value,
    floor: document.getElementById("floor").value,
    area: document.getElementById("area").value,
    notes: document.getElementById("notes").value
  };

  fetch(scriptURL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(response => response.json())
  .then(() => {
    alert("✅ تم حفظ البيانات بنجاح");
    document.querySelectorAll("input, textarea").forEach(el => el.value = "");
  })
  .catch(error => {
    console.error(error);
    alert("❌ حدث خطأ أثناء الحفظ");
  });
}
</script>

</body>
</html>
