<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مستودع البيت</title>

<style>
body{
  direction:rtl;
  font-family:Arial;
  background:#f5f5f5;
  margin:0;
}
header{
  text-align:center;
  padding:15px;
  font-size:22px;
  font-weight:bold;
}
.container{
  display:flex;
  gap:15px;
  padding:15px;
}
.form,.list{
  background:#fff;
  padding:15px;
  border-radius:10px;
}
.form{width:65%;}
.list{width:35%;}
input,textarea,select{
  width:100%;
  padding:8px;
  margin-bottom:8px;
}
button{
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.save{background:#2563eb;color:#fff;}
.item{
  border:1px solid #ddd;
  border-radius:8px;
  padding:8px;
  margin-bottom:8px;
  cursor:pointer;
}
.item:hover{background:#f0f0f0;}
img{
  max-width:100%;
  margin-top:10px;
  border-radius:8px;
}
@media(max-width:768px){
  .container{flex-direction:column;}
  .form,.list{width:100%;}
}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

  <!-- النموذج -->
  <div class="form">
    <input id="name" placeholder="اسم الغرض">

    <select id="category">
      <option value="">التصنيف</option>
      <option>مطبخ</option>
      <option>كهرباء</option>
      <option>أدوات</option>
    </select>

    <select id="shelf">
      <option value="">رقم الرف</option>
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>

    <select id="side">
      <option value="">الجهة</option>
      <option>يمين</option>
      <option>يسار</option>
    </select>

    <select id="level">
      <option value="">المستوى</option>
      <option>علوي</option>
      <option>وسط</option>
      <option>سفلي</option>
    </select>

    <select id="zone">
      <option value="">المنطقة</option>
      <option>المخزن</option>
      <option>المطبخ</option>
      <option>الملحق</option>
    </select>

    <textarea id="notes" placeholder="ملاحظات"></textarea>

    <!-- زر الكاميرا -->
    <input id="image" type="file" accept="image/*" capture="environment">

    <button class="save" type="button" onclick="saveItem()">حفظ</button>

    <hr>

    <h3 id="viewName">اختر غرضًا</h3>
    <div id="viewInfo"></div>
    <img id="viewImage" style="display:none;">
  </div>

  <!-- القائمة -->
  <div class="list">
    <input id="search" placeholder="ابحث بالاسم أو رقم الرف">
    <div id="itemsList"></div>
  </div>

</div>

<script>
const scriptURL =
"https://script.google.com/macros/s/AKfycbxqbICXqRgJ7OT8WFQH9cd-6lFN75vONOR-Fzrf87w2Mt_g1dBfkZhZ6UPyvbSrAZ49/exec";

let items = [];

function loadItems(){
  fetch(scriptURL)
    .then(res => res.json())
    .then(data => {
      items = data.filter(i => i.name); // ⬅️ نضمن وجود الاسم
      renderItems(items);
    });
}

function renderItems(data){
  itemsList.innerHTML = "";
  data.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = item.name + " — رف " + item.shelf;
    div.onclick = () => showItem(index);
    itemsList.appendChild(div);
  });
}

function showItem(index){
  const item = items[index];
  viewName.textContent = item.name;
  viewInfo.innerHTML = `
    <div>التصنيف: ${item.category || "-"}</div>
    <div>المكان: رف ${item.shelf} – ${item.zone || "-"}</div>
    <div>الجهة: ${item.side || "-"}</div>
    <div>المستوى: ${item.level || "-"}</div>
    <div>ملاحظات: ${item.notes || "-"}</div>
  `;
  viewImage.style.display = "none";
}

function saveItem(){
  const data = {
    name: name.value,
    category: category.value,
    shelf: shelf.value,
    side: side.value,
    level: level.value,
    zone: zone.value,
    notes: notes.value,
    image_url: ""
  };

  fetch(scriptURL,{
    method:"POST",
    mode:"no-cors",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(data)
  });

  alert("✅ تم حفظ الغرض");
  clearForm();
  setTimeout(loadItems,1000);
}

function clearForm(){
  document.querySelectorAll("input, textarea, select").forEach(e => e.value="");
}

search.oninput = () => {
  const v = search.value.trim();
  renderItems(
    items.filter(i =>
      i.name.includes(v) || String(i.shelf).includes(v)
    )
  );
};

loadItems();
</script>

</body>
</html>
