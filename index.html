<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نظام حفظ الصور</title>

<!-- أيقونات -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  font-family: Arial;
  direction: rtl;
  padding: 20px;
}

.menu {
  position: relative;
  display: inline-block;
}

.menu button {
  font-size: 20px;
  padding: 10px 15px;
  cursor: pointer;
}

.dropdown {
  display: none;
  position: absolute;
  background: #f9f9f9;
  min-width: 220px;
  box-shadow: 0 0 10px #ccc;
  border-radius: 5px;
}

.dropdown div {
  padding: 12px;
  cursor: pointer;
}

.dropdown div:hover {
  background: #eee;
}

.section {
  margin-top: 25px;
  display: none;
}
</style>
</head>

<body>

<h2>📦 نظام حفظ وبحث الصور</h2>

<!-- القائمة -->
<div class="menu">
  <button onclick="toggleMenu()">☰ القائمة</button>
  <div id="dropdown" class="dropdown">

    <div onclick="showSection('upload')">
      <i class="fa fa-folder-open"></i> حفظ الصور
    </div>

    <div onclick="showSection('searchName')">
      <i class="fa fa-search"></i> البحث بالاسم
    </div>

    <div onclick="showSection('searchImage')">
      <i class="fa fa-image"></i> البحث بالصورة
    </div>

  </div>
</div>

<!-- حفظ الصور -->
<div id="upload" class="section">
  <h3>📂 حفظ صورة</h3>
  <input type="text" id="imageName" placeholder="اسم الصورة"><br><br>
  <input type="file" id="imageFile"><br><br>
  <button onclick="uploadImage()">رفع الصورة</button>
  <p id="uploadResult"></p>
</div>

<!-- البحث بالاسم -->
<div id="searchName" class="section">
  <h3>🔍 البحث بالاسم</h3>
  <input type="text" placeholder="اكتب الاسم">
  <button>بحث</button>
</div>

<!-- البحث بالصورة -->
<div id="searchImage" class="section">
  <h3>🖼️ البحث بالصورة</h3>
  <input type="file">
  <button>بحث</button>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
  authDomain: "warehouse-house.firebaseapp.com",
  projectId: "warehouse-house",
  storageBucket: "warehouse-house.firebasestorage.app",
  messagingSenderId: "791378856906",
  appId: "1:791378856906:web:69aa95b1c53e2791865d33"
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);

window.uploadImage = async function () {
  const file = document.getElementById("imageFile").files[0];
  const name = document.getElementById("imageName").value;

  if (!file || !name) {
    alert("اكتب الاسم واختر صورة");
    return;
  }

  const storageRef = ref(storage, "images/" + name);
  await uploadBytes(storageRef, file);
  const url = await getDownloadURL(storageRef);

  document.getElementById("uploadResult").innerHTML =
    "✅ تم الحفظ<br><a href='" + url + "' target='_blank'>عرض الصورة</a>";
};
</script>

<script>
function toggleMenu() {
  const d = document.getElementById("dropdown");
  d.style.display = d.style.display === "block" ? "none" : "block";
}

function showSection(id) {
  document.querySelectorAll(".section").forEach(s => s.style.display = "none");
  document.getElementById("dropdown").style.display = "none";
  document.getElementById(id).style.display = "block";
}
</script>

</body>
</html>
