<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
body{direction:rtl;font-family:Arial;background:#f4f4f4;margin:0}
header{text-align:center;font-size:24px;padding:15px}
.container{display:flex;gap:15px;padding:15px}
.list,.form{background:#fff;padding:15px;border-radius:10px}
.list{width:35%}
.form{width:65%}
.item{border:1px solid #ddd;padding:8px;border-radius:8px;margin-bottom:8px}
.actions{display:flex;gap:5px;margin-top:5px}
button{border:none;border-radius:6px;padding:5px 8px;cursor:pointer}
.del{background:#ef4444;color:#fff}
@media(max-width:768px){.container{flex-direction:column}.list,.form{width:100%}}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">
  <div class="list">
    <input id="search" placeholder="ابحث">
    <div id="items"></div>
  </div>

  <div class="form">
    <input id="name" placeholder="اسم الغرض">
    <input id="category" placeholder="التصنيف">
    <input id="shelf" placeholder="رقم الرف">
    <textarea id="notes" placeholder="ملاحظات"></textarea>
    <button onclick="save()">حفظ</button>
    <hr>
    <h3 id="viewName"></h3>
  </div>
</div>

<script>
const URL="ضع_رابط_AppsScript_هنا";
let data=[];

function load(){
 fetch(URL).then(r=>r.json()).then(d=>{
  data=d;
  render(d);
 });
}

function render(list){
 items.innerHTML="";
 list.forEach(i=>{
  const div=document.createElement("div");
  div.className="item";
  div.innerHTML=`
    <b>${i.name||"غرض بدون اسم"}</b> (رف ${i.shelf})
    <div class="actions">
      <button class="del" onclick="del(${i.id})">حذف</button>
    </div>`;
  div.onclick=()=>viewName.textContent=i.name;
  items.appendChild(div);
 });
}

function save(){
 fetch(URL,{
  method:"POST",
  body:JSON.stringify({
   action:"add",
   name:name.value,
   category:category.value,
   shelf:shelf.value,
   notes:notes.value
  })
 });
 setTimeout(load,1000);
}

function del(id){
 if(!confirm("حذف؟"))return;
 fetch(URL,{method:"POST",body:JSON.stringify({action:"delete",id})});
 setTimeout(load,1000);
}

search.oninput=()=>render(data.filter(i=>(i.name||"").includes(search.value)));
load();
</script>

</body>
</html>
