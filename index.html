<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>

<style>
body{
  font-family: Tahoma, Arial;
  background:#f5f6f8;
  margin:0;
  padding:20px;
}
h1{margin-bottom:15px}

.container{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:20px;
}

/* القائمة */
.list{
  background:#fff;
  border-radius:10px;
  padding:15px;
}
.search{
  width:100%;
  padding:10px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:6px;
}
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border:1px solid #eee;
  border-radius:8px;
  margin-bottom:10px;
}
.item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid #ccc;
}
.buttons button{
  margin-left:5px;
  padding:6px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.edit{background:#f59e0b;color:#fff}
.delete{background:#ef4444;color:#fff}

/* النموذج */
.form{
  background:#fff;
  border-radius:10px;
  padding:15px;
}
.form label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}
.form input,.form textarea{
  width:100%;
  padding:8px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:6px;
}
.form-buttons{
  margin-top:15px;
}
.save{
  background:#2563eb;
  color:#fff;
  padding:10px 15px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.clear{
  background:#9ca3af;
  color:#fff;
  padding:10px 15px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.note{
  margin-top:10px;
  color:#555;
  font-size:13px;
}
</style>
</head>

<body>

<h1>📦 مستودع البيت</h1>

<div class="container">

<!-- القائمة -->
<div class="list">
  <input class="search" id="search" placeholder="ابحث بالاسم أو رقم الرف">
  <div id="items"></div>
</div>

<!-- النموذج -->
<div class="form">
  <label>اسم الغرض *</label>
  <input id="name">

  <label>التصنيف</label>
  <input id="category">

  <label>رقم الرف *</label>
  <input id="shelf">

  <label>المكان</label>
  <input id="location">

  <label>ملاحظات</label>
  <textarea id="notes"></textarea>

  <label>صورة</label>
  <input type="file" id="image">

  <div class="form-buttons">
    <button class="save" onclick="saveItem()">حفظ</button>
    <button class="clear" onclick="clearForm()">مسح</button>
  </div>

  <div class="note">الصور والبيانات محفوظة في Firebase</div>
</div>

</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
  authDomain: "warehouse-house.firebaseapp.com",
  projectId: "warehouse-house",
  storageBucket: "warehouse-house.firebasestorage.app",
  messagingSenderId: "791378856906",
  appId: "1:791378856906:web:69aa95b1c53e2791865d33"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.saveItem = async function(){
  const name = nameInput.value;
  const shelf = shelfInput.value;
  if(!name || !shelf){ alert("أدخل الاسم ورقم الرف"); return }

  let imageUrl = "";
  if(image.files[0]){
    const imgRef = ref(storage, "images/" + Date.now());
    await uploadBytes(imgRef, image.files[0]);
    imageUrl = await getDownloadURL(imgRef);
  }

  await addDoc(collection(db,"items"),{
    name,
    category:category.value,
    shelf,
    location:location.value,
    notes:notes.value,
    image:imageUrl
  });

  clearForm();
  loadItems();
}

window.clearForm = function(){
  document.querySelectorAll("input,textarea").forEach(e=>{
    if(e.type!=="file") e.value="";
  });
}

async function loadItems(){
  items.innerHTML="";
  const snap = await getDocs(collection(db,"items"));
  snap.forEach(d=>{
    const x=d.data();
    items.innerHTML+=`
    <div class="item">
      <div>
        <strong>${x.name}</strong><br>
        رف - ${x.shelf}
      </div>
      <div>
        ${x.image?`<img src="${x.image}">`:""}
        <div class="buttons">
          <button class="delete" onclick="deleteItem('${d.id}')">حذف</button>
        </div>
      </div>
    </div>`;
  });
}

window.deleteItem = async function(id){
  if(confirm("حذف العنصر؟")){
    await deleteDoc(doc(db,"items",id));
    loadItems();
  }
}

loadItems();
</script>

</body>
</html>
