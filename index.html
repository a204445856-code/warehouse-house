<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
body{
  font-family: Tahoma, Arial;
  background:#f5f6f7;
  margin:0;
}
header{
  text-align:center;
  padding:20px;
  font-size:26px;
}
.container{
  display:flex;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}
.card{
  background:#fff;
  border-radius:10px;
  padding:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  flex:1;
  min-width:300px;
}
input, select, textarea, button{
  width:100%;
  padding:8px;
  margin-top:6px;
  font-size:14px;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:10px;
}
.item{
  border-bottom:1px solid #eee;
  padding:8px 0;
}
img{
  max-width:100%;
  border-radius:6px;
  margin-top:5px;
}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

<!-- القائمة -->
<div class="card">
  <h3>الأغراض</h3>
  <div id="items">جاري التحميل...</div>
</div>

<!-- النموذج -->
<div class="card">
  <h3>إضافة غرض</h3>

  <input id="name" placeholder="اسم الغرض">
  <input id="category" placeholder="التصنيف">
  <input id="shelf" placeholder="رقم الرف">
  <input id="level" placeholder="المستوى">
  <textarea id="notes" placeholder="ملاحظات"></textarea>
  <input type="file" id="image">

  <button onclick="saveItem()">حفظ</button>
</div>

</div>

<script>
const SCRIPT_URL =
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxz4O88gBNVIIfEmIUwcYTZX9dqmOwwQUx9AvSXCT48n_LycZIHSNs7zIrPWb1Kdpek/exec";

async function saveItem(){
  const fd = new FormData();
  fd.append("name", name.value);
  fd.append("category", category.value);
  fd.append("shelf", shelf.value);
  fd.append("level", level.value);
  fd.append("notes", notes.value);
  if(image.files[0]) fd.append("image", image.files[0]);

  const res = await fetch(SCRIPT_URL, { method:"POST", body:fd });
  const json = await res.json();

  if(json.status === "success"){
    alert("تم الحفظ");
    name.value = category.value = shelf.value = level.value = notes.value = "";
    image.value = "";
    loadItems();
  }else{
    alert("حدث خطأ");
  }
}

async function loadItems(){
  const res = await fetch(SCRIPT_URL + "?action=list");
  const data = await res.json();

  items.innerHTML = "";
  if(data.length === 0){
    items.innerHTML = "لا توجد بيانات";
    return;
  }

  data.forEach(i=>{
    items.innerHTML += `
      <div class="item">
        <b>${i.name}</b><br>
        ${i.category} | رف ${i.shelf} | مستوى ${i.level}<br>
        ${i.notes || ""}
        ${i.image ? `<img src="${i.image}">` : ""}
      </div>
    `;
  });
}

loadItems();
</script>

</body>
</html>
