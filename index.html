<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
body{font-family:Tahoma,Arial;background:#f5f6f7;margin:0}
header{text-align:center;padding:20px;font-size:26px}
.container{display:flex;gap:20px;padding:20px;flex-wrap:wrap}
.card{background:#fff;border-radius:10px;padding:15px;box-shadow:0 2px 6px rgba(0,0,0,.1);flex:1;min-width:320px}

input,select,textarea,button{
  width:100%;padding:8px;margin-top:6px;font-size:14px
}
button{
  background:#2563eb;color:#fff;border:none;
  border-radius:6px;padding:10px;cursor:pointer
}

.top-bar{display:flex;gap:8px;align-items:center}
.icon-btn{
  background:#2563eb;color:#fff;border:none;
  border-radius:6px;padding:6px 10px;
  font-size:18px;cursor:pointer
}

.item{
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid #eee;padding:6px 0
}
.item img{
  width:40px;height:40px;object-fit:cover;border-radius:6px
}
.item-name{flex:1;cursor:pointer}
.item-actions span{
  cursor:pointer;margin-right:6px;font-size:18px
}

/* معرض الصور */
.gallery-screen{
  display:none;position:fixed;inset:0;
  background:#fff;z-index:1000;
  padding:20px;overflow:auto
}
.gallery{
  display:flex;flex-wrap:wrap;gap:10px
}
.gallery img{
  width:90px;height:90px;object-fit:cover;
  border-radius:6px;cursor:pointer
}
.close{font-size:20px;cursor:pointer}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

<!-- القائمة -->
<div class="card">
  <div class="top-bar">
    <input id="searchInput" placeholder="🔍 ابحث بالاسم..." oninput="searchByName()">
    <button class="icon-btn" onclick="openGallery()">🖼️</button>
  </div>
  <div id="items">جاري التحميل...</div>
</div>

<!-- الإدخال -->
<div class="card">
  <h3>إضافة / تعديل غرض</h3>

  <input id="itemName" placeholder="اسم الغرض">

  <select id="category">
    <option value="">المنطقة / القسم</option>
    <option>مستودع يمين</option>
    <option>مستودع يسار</option>
    <option>مطبخ</option>
    <option>صالة</option>
    <option>غرفة البنات</option>
    <option>غرفة الأولاد</option>
    <option>غرفة النوم</option>
  </select>

  <select id="shelf"><option value="">رقم الرف</option></select>

  <select id="level">
    <option value="">المستوى</option>
    <option>أعلى</option>
    <option>وسط</option>
    <option>أسفل</option>
  </select>

  <textarea id="notes" placeholder="ملاحظات"></textarea>
  <input type="file" id="image">

  <button onclick="saveItem()">حفظ</button>
</div>

</div>

<!-- معرض الصور -->
<div class="gallery-screen" id="galleryScreen">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3>🖼️ معرض الصور</h3>
    <span class="close" onclick="closeGallery()">✖</span>
  </div>
  <div class="gallery" id="galleryImages"></div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwQW9VvBOgXMcTrO8FLBw2urg0tsO4Z3QLuiF-u2Ig1DMiW5AX0mAIsalKihgj5-IDx/exec";

let ITEMS=[];
let CURRENT_INDEX=null;

/* الأرفف */
for(let i=1;i<=100;i++){
  shelf.innerHTML+=`<option>${i}</option>`;
}

/* تحميل */
async function loadItems(){
  const r=await fetch(SCRIPT_URL+"?action=list");
  ITEMS=await r.json();
  renderItems(ITEMS);
}

/* عرض القائمة */
function renderItems(arr){
  items.innerHTML="";
  if(!arr.length){
    items.innerHTML="لا توجد بيانات";
    return;
  }
  arr.forEach((i,idx)=>{
    items.innerHTML+=`
      <div class="item">
        ${i.image ? `<img src="${i.image}">` : ``}
        <div class="item-name" onclick="editItem(${idx})">${i.name}</div>
        <div class="item-actions">
          <span onclick="editItem(${idx})">✏️</span>
          <span onclick="deleteItem(${idx})">🗑️</span>
        </div>
      </div>
    `;
  });
}

/* تعبئة النموذج */
function editItem(index){
  const i=ITEMS[index];
  CURRENT_INDEX=index;
  itemName.value=i.name;
  category.value=i.category;
  shelf.value=i.shelf;
  level.value=i.level;
  notes.value=i.notes||"";
}

/* حذف (واجهة فقط) */
function deleteItem(index){
  if(!confirm("هل تريدين حذف الغرض؟")) return;
  ITEMS.splice(index,1);
  renderItems(ITEMS);
}

/* بحث */
function searchByName(){
  const q=searchInput.value.trim();
  renderItems(q?ITEMS.filter(i=>i.name.startsWith(q)):ITEMS);
}

/* معرض الصور */
function openGallery(){
  galleryImages.innerHTML="";
  ITEMS.forEach((i,idx)=>{
    if(i.image){
      galleryImages.innerHTML+=`
        <img src="${i.image}" onclick="editItem(${idx});closeGallery()">
      `;
    }
  });
  galleryScreen.style.display="block";
}
function closeGallery(){
  galleryScreen.style.display="none";
}

/* حفظ */
async function saveItem(){
  const name=itemName.value.trim();
  if(!name){
    alert("اسم الغرض مطلوب");
    return;
  }

  const fd=new FormData();
  fd.append("name",name);
  fd.append("category",category.value);
  fd.append("shelf",shelf.value);
  fd.append("level",level.value);
  fd.append("notes",notes.value);
  if(image.files[0]) fd.append("image",image.files[0]);

  const r=await fetch(SCRIPT_URL,{method:"POST",body:fd});
  const j=await r.json();

  if(j.status==="success"){
    itemName.value=category.value=shelf.value=level.value=notes.value="";
    image.value="";
    loadItems();
  }else{
    alert("فشل الحفظ");
  }
}

loadItems();
</script>

</body>
</html>
