
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مستودع البيت V2</title>

<style>
body{font-family:Arial;background:#f5f6f7;padding:20px}
h2{text-align:center}
.container{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#fff;padding:15px;border-radius:8px}
input,textarea,select,button{width:100%;padding:8px;margin:6px 0}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding:8px 0}
.item img{width:60px;height:60px;object-fit:cover;border-radius:4px;cursor:pointer}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
#gallery img{width:100%;height:120px;object-fit:cover;border-radius:6px;cursor:pointer}
@media(max-width:768px){.container{grid-template-columns:1fr}}
</style>
</head>

<body>

<h2>📦 مستودع البيت V2</h2>

<div class="container">

<div class="card">
<h3>إضافة / تعديل</h3>

<input id="name" placeholder="اسم الغرض *">

<label>رقم الرف *</label>
<select id="shelf"></select>

<label>المكان</label>
<select id="place"></select>
<button type="button" id="addPlaceBtn">➕ إضافة مكان</button>

<textarea id="notes" placeholder="ملاحظات"></textarea>

<input type="file" id="image" accept="image/*" multiple>

<button id="saveBtn">💾 حفظ</button>
<p id="msg"></p>
</div>

<div class="card">
<h3>المحتويات</h3>
<div id="list"></div>
</div>

</div>

<div class="card" style="margin-top:20px">
<h3>🖼️ استديو الصور</h3>
<div id="gallery"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig={
apiKey:"ضع_بياناتك",
authDomain:"ضع_بياناتك",
projectId:"warehouse-house",
storageBucket:"warehouse-house.appspot.com",
messagingSenderId:"791378856906",
appId:"ضع_بياناتك"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const storage=getStorage(app);

const nameInput=document.getElementById("name");
const shelfSelect=document.getElementById("shelf");
const placeSelect=document.getElementById("place");
const notesInput=document.getElementById("notes");
const imageInput=document.getElementById("image");
const list=document.getElementById("list");
const gallery=document.getElementById("gallery");
const msg=document.getElementById("msg");

let editId=null;
let cache=[];

/* رفوف */
for(let i=1;i<=100;i++){
let opt=document.createElement("option");
opt.value=i;
opt.textContent="رف "+i;
shelfSelect.appendChild(opt);
}

/* تحميل الأماكن */
async function loadPlaces(){
placeSelect.innerHTML='<option value="">-- اختر المكان --</option>';
const snap=await getDocs(collection(db,"places"));
snap.forEach(d=>{
let opt=document.createElement("option");
opt.value=d.data().name;
opt.textContent=d.data().name;
placeSelect.appendChild(opt);
});
}

/* إضافة مكان */
document.getElementById("addPlaceBtn").onclick=async()=>{
let newPlace=prompt("اكتب اسم المكان الجديد");
if(!newPlace) return;
await addDoc(collection(db,"places"),{name:newPlace});
loadPlaces();
};

/* حفظ */
document.getElementById("saveBtn").onclick=async()=>{
if(!nameInput.value||!shelfSelect.value){
msg.innerText="❌ الاسم ورقم الرف مطلوبين";
return;
}

let imageUrls=[];
let files=imageInput.files;

for(let i=0;i<files.length && i<5;i++){
let file=files[i];
let imgRef=ref(storage,"images/"+Date.now()+"_"+file.name);
await uploadBytes(imgRef,file);
let url=await getDownloadURL(imgRef);
imageUrls.push(url);
}

let data={
name:nameInput.value,
shelf:shelfSelect.value,
place:placeSelect.value,
notes:notesInput.value,
images:imageUrls
};

if(editId){
await updateDoc(doc(db,"items",editId),data);
editId=null;
}else{
await addDoc(collection(db,"items"),data);
}

loadData();
msg.innerText="✅ تم الحفظ";
};

/* تحميل البيانات */
async function loadData(){
list.innerHTML="";
gallery.innerHTML="";
cache=[];

const snap=await getDocs(collection(db,"items"));
snap.forEach(d=>{
let x={id:d.id,...d.data()};
cache.push(x);

let div=document.createElement("div");
div.className="item";
div.innerHTML=`<b>${x.name}</b> - رف ${x.shelf} - ${x.place||""}`;
div.onclick=()=>editItem(x.id);
list.appendChild(div);

if(x.images){
x.images.forEach(url=>{
let img=document.createElement("img");
img.src=url;
img.onclick=()=>editItem(x.id);
gallery.appendChild(img);
});
}
});
}

window.editItem=id=>{
let x=cache.find(i=>i.id===id);
if(!x)return;
nameInput.value=x.name;
shelfSelect.value=x.shelf;
placeSelect.value=x.place;
notesInput.value=x.notes;
editId=id;
window.scrollTo({top:0,behavior:"smooth"});
};

loadPlaces();
loadData();
</script>

</body>
</html>
