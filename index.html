<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{margin:0;background:#f3f4f6}
header{background:#fff;padding:15px 25px;font-size:22px;font-weight:bold;border-bottom:1px solid #e5e7eb}

.container{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;padding:20px}
.card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}

label{font-size:13px;color:#374151;margin-top:10px;display:block}
input,select,textarea{
  width:100%;padding:10px;margin-top:5px;
  border:1px solid #ddd;border-radius:8px;
  background:#fff;color:#111
}
textarea{resize:none;height:80px}

select{
  appearance:auto;
  -webkit-appearance:auto;
  -moz-appearance:auto;
}

.buttons{display:flex;gap:10px;margin-top:15px}
.save{background:#2563eb;color:#fff;border:none;padding:10px;border-radius:8px;flex:1;cursor:pointer}
.clear{background:#9ca3af;color:#fff;border:none;padding:10px;border-radius:8px;flex:1;cursor:pointer}

.note{margin-top:10px;font-size:12px;color:#6b7280}

@media(max-width:900px){
  .container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

  <!-- الإدخال -->
  <div class="card">
    <!-- ✅ الفورم مربوط بالحفظ -->
    <form id="itemForm"
      action="https://script.google.com/macros/s/AKfycbxST_WcgWG8mAKONieRUQhIj_fgwYQxkOHvhQx8wCJJ42-r2LM8e-24_8BS2k1vfpA/exec"
      method="POST"
      enctype="multipart/form-data"
      target="hiddenFrame">

      <label>اسم الغرض *</label>
      <input name="name" required>

      <label>التصنيف</label>
      <input name="category">

      <label>رقم الرف *</label>
      <!-- ✅ قائمة الأرفف -->
      <select name="shelf" id="shelf" required>
        <option value="">اختر رقم الرف</option>
      </select>

      <label>المستوى</label>
      <select name="level">
        <option value="">اختر</option>
        <option>أعلى</option>
        <option>وسط</option>
        <option>أسفل</option>
      </select>

      <label>ملاحظات</label>
      <textarea name="notes"></textarea>

      <label>صورة (اختياري)</label>
      <input type="file" name="image" accept="image/*">

      <div class="buttons">
        <!-- ✅ زر حفظ حقيقي -->
        <button class="save" type="submit">حفظ</button>
        <button class="clear" type="reset">مسح الحقول</button>
      </div>

      <div class="note">
        التخزين يتم في Google Sheets + الصور في Google Drive
      </div>
    </form>

    <!-- iframe للحفظ بدون إعادة تحميل -->
    <iframe name="hiddenFrame" style="display:none"></iframe>
  </div>

</div>

<script>
/* ✅ تعبئة قائمة الأرفف (1 → 100) */
const shelfSelect = document.getElementById("shelf");
for(let i=1;i<=100;i++){
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = i;
  shelfSelect.appendChild(opt);
}
</script>

</body>
</html>
