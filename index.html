<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>
<style>
body{font-family:tahoma;background:#f5f5f5;margin:0;padding:20px}
.container{display:flex;gap:20px}
.box{background:#fff;padding:15px;border-radius:10px;flex:1}
input,select,textarea,button{width:100%;margin:5px 0;padding:8px}
.item{border:1px solid #ddd;padding:10px;border-radius:8px;margin-bottom:10px}
img{max-width:100%;border-radius:8px;margin-top:5px}
.btns{display:flex;gap:5px}
.delete{background:#e74c3c;color:#fff}
.edit{background:#f39c12;color:#fff}
</style>
</head>

<body>
<h2>📦 مستودع البيت</h2>

<div class="container">
<div class="box">
<input id="name" placeholder="اسم الغرض">
<select id="category">
<option>كهرباء</option><option>مطبخ</option><option>أدوات</option>
</select>

<select id="shelf">
<script>
for(let i=1;i<=50;i++)document.write(`<option>${i}</option>`)
</script>
</select>

<select id="side"><option>يمين</option><option>يسار</option></select>
<select id="level"><option>علوي</option><option>سفلي</option></select>
<select id="zone"><option>المخزن</option><option>المطبخ</option></select>

<textarea id="notes" placeholder="ملاحظات"></textarea>

<input type="file" id="image" accept="image/*" capture="environment">
<button onclick="save()">حفظ</button>
</div>

<div class="box" id="list"></div>
</div>

<script>
const URL = "ضع_هنا_رابط_exec";

let items=[];
fetch(URL).then(r=>r.json()).then(d=>{items=d;render();});

function render(){
list.innerHTML="";
items.forEach((i,idx)=>{
list.innerHTML+=`
<div class="item">
<b>${i.name||"غرض بدون اسم"} (رف ${i.shelf})</b>
${i.image_url?`<img src="${i.image_url}">`:""}
<div class="btns">
<button class="edit" onclick="edit(${idx})">تعديل</button>
<button class="delete" onclick="del(${idx})">حذف</button>
</div>
</div>`;
});
}

function save(){
const file=image.files[0];
if(file){
const r=new FileReader();
r.onload=()=>send(r.result.split(",")[1],file);
r.readAsDataURL(file);
}else send();
}

function send(img, file){
fetch(URL,{
method:"POST",
body:JSON.stringify({
name:name.value,
category:category.value,
shelf:shelf.value,
side:side.value,
level:level.value,
zone:zone.value,
notes:notes.value,
image:img,
imageName:file?.name,
imageType:file?.type
})
}).then(()=>location.reload());
}

function del(i){
fetch(URL,{method:"POST",body:JSON.stringify({action:"delete",id:i})})
.then(()=>location.reload());
}
</script>
</body>
</html>
