<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مستودع البيت</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f7;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
    }
    input, textarea, select, button {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
    }
    button {
      cursor: pointer;
    }
    .item {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<h1>📦 مستودع البيت</h1>

<div class="container">

  <!-- النموذج -->
  <div class="card">
    <h3>إضافة / تعديل</h3>

    <input id="name" placeholder="اسم الغرض *">
    <input id="category" placeholder="التصنيف (اختياري)">
    <input id="shelf" placeholder="رقم الرف *">
    <input id="place" placeholder="المكان">
    <textarea id="notes" placeholder="ملاحظات"></textarea>
    <input type="file" id="image">

    <button id="saveBtn">💾 حفظ</button>
    <button onclick="clearForm()">🧹 مسح</button>
  </div>

  <!-- القائمة -->
  <div class="card">
    <h3>بحث</h3>
    <input id="search" placeholder="ابحث بالاسم">
    <div id="list"></div>
  </div>

</div>

<script type="module">
  // Firebase CDN
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

  // 🔑 إعدادات Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
    authDomain: "warehouse-house.firebaseapp.com",
    projectId: "warehouse-house",
    storageBucket: "warehouse-house.firebasestorage.app",
    messagingSenderId: "791378856906",
    appId: "1:791378856906:web:69aa95b1c53e2791865d33"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  // عناصر
  const name = document.getElementById("name");
  const category = document.getElementById("category");
  const shelf = document.getElementById("shelf");
  const place = document.getElementById("place");
  const notes = document.getElementById("notes");
  const image = document.getElementById("image");
  const list = document.getElementById("list");
  const search = document.getElementById("search");

  let editId = null;

  // حفظ
  document.getElementById("saveBtn").addEventListener("click", async () => {
    if (!name.value || !shelf.value) {
      alert("الاسم ورقم الرف مطلوبين");
      return;
    }

    let imageUrl = "";

    if (image.files[0]) {
      const imgRef = ref(storage, "images/" + Date.now());
      await uploadBytes(imgRef, image.files[0]);
      imageUrl = await getDownloadURL(imgRef);
    }

    const data = {
      name: name.value,
      category: category.value,
      shelf: shelf.value,
      place: place.value,
      notes: notes.value,
      image: imageUrl
    };

    if (editId) {
      await updateDoc(doc(db, "items", editId), data);
      editId = null;
    } else {
      await addDoc(collection(db, "items"), data);
    }

    clearForm();
    loadData();
  });

  // تحميل البيانات
  async function loadData() {
    list.innerHTML = "";
    const snap = await getDocs(collection(db, "items"));

    snap.forEach(d => {
      const item = d.data();
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div>
          <strong>${item.name}</strong><br>
          رف: ${item.shelf}
        </div>
        ${item.image ? `<img src="${item.image}">` : ""}
      `;
      list.appendChild(div);
    });
  }

  // بحث
  search.addEventListener("input", async () => {
    const q = search.value.toLowerCase();
    list.innerHTML = "";
    const snap = await getDocs(collection(db, "items"));

    snap.forEach(d => {
      const item = d.data();
      if (item.name.toLowerCase().includes(q)) {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<strong>${item.name}</strong>`;
        list.appendChild(div);
      }
    });
  });

  function clearForm() {
    name.value = "";
    category.value = "";
    shelf.value = "";
    place.value = "";
    notes.value = "";
    image.value = "";
  }

  loadData();
</script>

</body>
</html>
