<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
body{font-family:Tahoma,Arial;background:#f5f6f7;margin:0}
header{text-align:center;padding:20px;font-size:26px}
.container{display:flex;gap:20px;padding:20px;flex-wrap:wrap}
.card{
  background:#fff;border-radius:10px;padding:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  flex:1;min-width:320px
}

input,textarea,button{
  width:100%;padding:8px;margin-top:6px;font-size:14px
}
button{
  background:#2563eb;color:#fff;border:none;
  border-radius:6px;padding:10px;cursor:pointer
}

.top-bar{display:flex;gap:8px;align-items:center}
.icon-btn{
  background:#2563eb;color:#fff;border:none;
  border-radius:6px;padding:6px 10px;
  font-size:18px;cursor:pointer
}

.item{
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid #eee;padding:6px 0
}
.item img{
  width:40px;height:40px;object-fit:cover;border-radius:6px
}
.item-name{flex:1;cursor:pointer}
.item-actions span{
  cursor:pointer;margin-right:6px;font-size:18px
}

/* معرض الصور */
.gallery-screen{
  display:none;position:fixed;inset:0;
  background:#fff;z-index:1000;
  padding:20px;overflow:auto
}
.gallery{
  display:flex;flex-wrap:wrap;gap:10px
}
.gallery img{
  width:90px;height:90px;object-fit:cover;
  border-radius:6px;cursor:pointer
}
.close{font-size:20px;cursor:pointer}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

<!-- القائمة -->
<div class="card">
  <div class="top-bar">
    <input id="searchInput" placeholder="🔍 ابحث بالاسم..." oninput="searchByName()">
    <button class="icon-btn" onclick="openGallery()">🖼️</button>
  </div>

  <button style="margin-top:8px" onclick="openForm()">➕ إضافة غرض (مع صورة)</button>

  <div id="items">جاري التحميل...</div>
</div>

<!-- العرض -->
<div class="card">
  <h3>بيانات الغرض</h3>

  <input id="v_name" placeholder="اسم الغرض" readonly>
  <input id="v_category" placeholder="القسم" readonly>
  <input id="v_shelf" placeholder="رقم الرف" readonly>
  <input id="v_level" placeholder="المستوى" readonly>
  <textarea id="v_notes" placeholder="ملاحظات" readonly></textarea>

  <img id="v_image" style="max-width:100%;margin-top:10px;border-radius:8px;display:none">
</div>

</div>

<!-- معرض الصور -->
<div class="gallery-screen" id="galleryScreen">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3>🖼️ معرض الصور</h3>
    <span class="close" onclick="closeGallery()">✖</span>
  </div>
  <div class="gallery" id="galleryImages"></div>
</div>

<script>
/*
⚠️ غيّري هذا فقط
ضعـي رابط Google Form هنا
*/
const GOOGLE_FORM_URL = "PUT_GOOGLE_FORM_LINK_HERE";

/*
⚠️ غيّري هذا
رابط Google Sheet بصيغة JSON
*/
const SHEET_JSON_URL =
"https://docs.google.com/spreadsheets/d/1foENTEF7sgI5bHaPNq1nIe4JD9Boo1kbnetJWwIa9Fg/gviz/tq?tqx=out:json";

let ITEMS=[];

/* فتح النموذج */
function openForm(){
  window.open(GOOGLE_FORM_URL,"_blank");
}

/* تحميل البيانات */
async function loadItems(){
  const r = await fetch(SHEET_JSON_URL);
  const text = await r.text();
  const json = JSON.parse(text.substring(47).slice(0,-2));

  ITEMS = json.table.rows.map(r=>{
    const c=r.c;
    return {
      name: c[1]?.v || "",
      category: c[2]?.v || "",
      shelf: c[3]?.v || "",
      level: c[4]?.v || "",
      notes: c[5]?.v || "",
      image: c[6]?.v || ""
    };
  }).filter(i=>i.name);

  renderItems(ITEMS);
}

/* عرض القائمة */
function renderItems(arr){
  items.innerHTML="";
  if(!arr.length){
    items.innerHTML="لا توجد بيانات";
    return;
  }
  arr.forEach((i,idx)=>{
    items.innerHTML+=`
      <div class="item">
        ${i.image?`<img src="${i.image}">`:``}
        <div class="item-name" onclick="showItem(${idx})">${i.name}</div>
      </div>
    `;
  });
}

/* عرض البيانات */
function showItem(index){
  const i=ITEMS[index];
  v_name.value=i.name;
  v_category.value=i.category;
  v_shelf.value=i.shelf;
  v_level.value=i.level;
  v_notes.value=i.notes;
  if(i.image){
    v_image.src=i.image;
    v_image.style.display="block";
  }else{
    v_image.style.display="none";
  }
}

/* بحث */
function searchByName(){
  const q=searchInput.value.trim();
  renderItems(q?ITEMS.filter(i=>i.name.startsWith(q)):ITEMS);
}

/* معرض الصور */
function openGallery(){
  galleryImages.innerHTML="";
  ITEMS.forEach((i,idx)=>{
    if(i.image){
      galleryImages.innerHTML+=`
        <img src="${i.image}" onclick="showItem(${idx});closeGallery()">
      `;
    }
  });
  galleryScreen.style.display="block";
}
function closeGallery(){
  galleryScreen.style.display="none";
}

loadItems();
</script>

</body>
</html>
