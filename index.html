<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📦 مستودع البيت</title>

<style>
body{font-family:tahoma;background:#f5f7fb;margin:0}
header{background:#fff;padding:12px;border-bottom:1px solid #ddd}
main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:16px}
input,select,textarea,button{width:100%;padding:10px;margin-bottom:10px}
button{background:#2563eb;color:#fff;border:none;border-radius:8px}
.item{border:1px solid #ddd;padding:10px;margin-bottom:10px}
.actions{display:flex;gap:6px}
.del{background:#ef4444;font-size:12px}
.edit{background:#f59e0b;font-size:12px}
</style>
</head>

<body>
<header><h2>📦 مستودع البيت</h2></header>
<main>

<div class="card">
<input id="name" placeholder="اسم الغرض">
<input id="category" placeholder="التصنيف">
<select id="shelf"></select>
<textarea id="notes" placeholder="ملاحظات"></textarea>
<input type="file" id="image">
<button onclick="save()">💾 حفظ</button>
</div>

<div class="card" id="list"></div>

</main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxr-KERLIww6mrFGgRuXBNfrmFTeDA_JNs_syEwXzT-c7nXzCREcTZYty6vSxZG4gOb/exec";
for(let i=1;i<=50;i++){
  shelf.innerHTML += `<option>${i}</option>`;
}

async function save(){
  const file = image.files[0];
  let img="";
  if(file){
    img = await toBase64(file);
  }

  await fetch(SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name:name.value,
      category:category.value,
      shelf:shelf.value,
      notes:notes.value,
      image:img
    })
  });

  alert("✅ تم الحفظ");
  load();
}

async function load(){
  const res = await fetch(SCRIPT_URL);
  const data = await res.json();
  list.innerHTML="";
  data.forEach(i=>{
    list.innerHTML += `
    <div class="item">
      <b>${i.name}</b><br>
      رف: ${i.shelf}<br>
      ${i.image_url ? `<img src="${i.image_url}" width="80">`:""}
      <div class="actions">
        <button class="del" onclick="del('${i.id}')">حذف</button>
      </div>
    </div>`;
  });
}

async function del(id){
  if(!confirm("حذف؟")) return;
  await fetch(SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({delete_id:id})
  });
  load();
}

function toBase64(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result);
    r.readAsDataURL(file);
  });
}

load();
</script>
</body>
</html>
