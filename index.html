<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>

<style>
body{
  font-family: Arial;
  background:#f5f6f7;
  padding:20px;
}
.container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.card{
  background:#fff;
  padding:15px;
  border-radius:8px;
}
input, textarea, select, button{
  width:100%;
  padding:8px;
  margin:6px 0;
}
button{cursor:pointer}
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:10px 0;
}
.item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:4px;
}
.actions{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.actions button{
  font-size:12px;
}
</style>
</head>

<body>

<h2 style="text-align:center">📦 مستودع البيت</h2>

<div class="container">

<!-- النموذج -->
<div class="card">
<h3>إضافة عنصر جديد</h3>

<input id="name" placeholder="اسم الغرض *">

<label>رقم الرف</label>
<select id="shelf"></select>

<label>المكان</label>
<select id="place">
  <option value="">-- اختر المكان --</option>
  <option>البدروم</option>
  <option>رف أيمن</option>
  <option>رف أيسر</option>
  <option>رف أمام</option>
  <option>المطبخ</option>
  <option>غرفة البنات</option>
  <option>غرفة الأولاد</option>
  <option>الصالة</option>
  <option>تحت المغسلة</option>
  <option>غرفتي</option>
  <option>استقبال</option>
  <option>استقبال البيت</option>
</select>

<textarea id="notes" placeholder="ملاحظات"></textarea>
<input type="file" id="image">

<button id="addBtn">➕ إضافة جديدة</button>
<p id="msg"></p>
</div>

<!-- القائمة -->
<div class="card">
<h3>المحتويات</h3>
<div id="list"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
  authDomain: "warehouse-house.firebaseapp.com",
  projectId: "warehouse-house",
  storageBucket: "warehouse-house.appspot.com",
  messagingSenderId: "791378856906",
  appId: "1:791378856906:web:69aa95b1c53e2791865d33"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const nameInput = document.getElementById("name");
const shelfSelect = document.getElementById("shelf");
const placeSelect = document.getElementById("place");
const notesInput = document.getElementById("notes");
const imageInput = document.getElementById("image");
const list = document.getElementById("list");
const msg = document.getElementById("msg");

let cache = [];
let editingId = null;

/* إنشاء الرفوف */
for(let i=1;i<=100;i++){
  const o=document.createElement("option");
  o.value=i;
  o.textContent="رف "+i;
  shelfSelect.appendChild(o);
}

/* إضافة عنصر جديد */
document.getElementById("addBtn").onclick = async ()=>{
  if(!nameInput.value || !shelfSelect.value){
    msg.innerText="❌ الاسم ورقم الرف مطلوبين";
    return;
  }

  let imageUrl="";
  if(imageInput.files[0]){
    const r=ref(storage,"images/"+Date.now());
    await uploadBytes(r,imageInput.files[0]);
    imageUrl=await getDownloadURL(r);
  }

  await addDoc(collection(db,"items"),{
    name:nameInput.value,
    shelf:shelfSelect.value,
    place:placeSelect.value,
    notes:notesInput.value,
    image:imageUrl
  });

  clearForm();
  loadData();
};

/* تحميل العناصر */
async function loadData(){
  list.innerHTML="";
  cache=[];
  const snap=await getDocs(collection(db,"items"));

  snap.forEach(d=>{
    const x={id:d.id,...d.data()};
    cache.push(x);

    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <div>
        <b>${x.name}</b><br>
        رف ${x.shelf} - ${x.place||""}
      </div>

      <div style="display:flex;gap:10px;align-items:center">
        ${x.image?`<img src="${x.image}">`:""}
        <div class="actions">
          <button onclick="editItem('${x.id}')">✏️ تعديل</button>
          <button onclick="saveItem('${x.id}')">💾 حفظ</button>
        </div>
      </div>
    `;
    list.appendChild(div);
  });
}

/* تعديل */
window.editItem=function(id){
  const x=cache.find(i=>i.id===id);
  if(!x)return;

  nameInput.value=x.name;
  shelfSelect.value=x.shelf;
  placeSelect.value=x.place;
  notesInput.value=x.notes;
  editingId=id;

  window.scrollTo({top:0,behavior:"smooth"});
};

/* حفظ التعديل */
window.saveItem=async function(id){
  const x=cache.find(i=>i.id===id);
  if(!x)return;

  const data={
    name:nameInput.value,
    shelf:shelfSelect.value,
    place:placeSelect.value,
    notes:notesInput.value,
    image:x.image
  };

  await updateDoc(doc(db,"items",id),data);
  editingId=null;
  clearForm();
  loadData();
};

/* مسح النموذج */
function clearForm(){
  nameInput.value="";
  shelfSelect.value="";
  placeSelect.value="";
  notesInput.value="";
  imageInput.value="";
  msg.innerText="";
}

loadData();
</script>

</body>
</html>
