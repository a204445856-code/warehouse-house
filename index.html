<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
body{font-family:Tahoma,Arial;background:#f5f6f7;margin:0}
header{text-align:center;padding:20px;font-size:26px}
.container{display:flex;gap:20px;padding:20px;flex-wrap:wrap}
.card{background:#fff;border-radius:10px;padding:15px;box-shadow:0 2px 6px rgba(0,0,0,.1);flex:1;min-width:320px}

input,select,textarea,button{
  width:100%;padding:8px;margin-top:6px;font-size:14px
}
button{
  background:#2563eb;color:#fff;border:none;
  border-radius:6px;padding:10px;cursor:pointer
}

.top-bar{display:flex;gap:8px;align-items:center}
.icon-btn{
  background:#2563eb;color:#fff;border:none;
  border-radius:6px;padding:6px 10px;
  font-size:18px;cursor:pointer
}

.item{
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid #eee;padding:6px 0
}
.item img{
  width:40px;height:40px;object-fit:cover;border-radius:6px;
  cursor:pointer
}
.item-name{flex:1;cursor:pointer}
.item-actions span{
  cursor:pointer;margin-right:6px;font-size:18px
}

/* معرض الصور */
.gallery-screen{
  display:none;position:fixed;inset:0;
  background:#fff;z-index:1000;
  padding:20px;overflow:auto
}
.gallery{
  display:flex;flex-wrap:wrap;gap:10px
}
.gallery img{
  width:90px;height:90px;object-fit:cover;
  border-radius:6px;cursor:pointer
}
.close{font-size:20px;cursor:pointer}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

<!-- القائمة -->
<div class="card">
  <div class="top-bar">
    <input id="searchInput" placeholder="🔍 ابحث بالاسم..." oninput="searchByName()">
    <button class="icon-btn" onclick="openGallery()">🖼️</button>
  </div>
  <div id="items">جاري التحميل...</div>
</div>

<!-- الإدخال -->
<div class="card">
  <h3>إضافة / تعديل غرض</h3>

  <!-- النموذج الأصلي (لم يتغير) -->
  <form id="itemForm"
        action="https://script.google.com/macros/s/AKfycbxST_WcgWG8mAKONieRUQhIj_fgwYQxkOHvhQx8wCJJ42-r2LM8e-24_8BS2k1vfpA/exec"
        method="POST"
        enctype="multipart/form-data"
        target="hiddenFrame"
        onsubmit="afterSubmit()">

    <input name="name" id="itemName" placeholder="اسم الغرض" required>

    <select name="category" id="category">
      <option value="">المنطقة / القسم</option>
      <option>مستودع يمين</option>
      <option>مستودع يسار</option>
      <option>مطبخ</option>
      <option>صالة</option>
      <option>غرفة البنات</option>
      <option>غرفة الأولاد</option>
      <option>غرفة النوم</option>
    </select>

    <select name="shelf" id="shelf"><option value="">رقم الرف</option></select>

    <select name="level" id="level">
      <option value="">المستوى</option>
      <option>أعلى</option>
      <option>وسط</option>
      <option>أسفل</option>
    </select>

    <textarea name="notes" id="notes" placeholder="ملاحظات"></textarea>
    <input type="file" name="image" id="image" accept="image/*">

    <button type="submit">حفظ</button>
  </form>

  <iframe name="hiddenFrame" style="display:none"></iframe>
</div>

</div>

<!-- 🔒 إضافة آمنة فقط لعرض الصورة الكبيرة -->
<div id="imageViewer" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  z-index:9999;
  justify-content:center;
  align-items:center
" onclick="this.style.display='none'">
  <img id="viewerImg" style="max-width:90%;max-height:90%;border-radius:10px">
</div>

<!-- معرض الصور (كما هو) -->
<div class="gallery-screen" id="galleryScreen">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3>🖼️ معرض الصور</h3>
    <span class="close" onclick="closeGallery()">✖</span>
  </div>
  <div class="gallery" id="galleryImages"></div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxST_WcgWG8mAKONieRUQhIj_fgwYQxkOHvhQx8wCJJ42-r2LM8e-24_8BS2k1vfpA/exec";

let ITEMS=[];

/* الأرفف */
for(let i=1;i<=100;i++){
  shelf.innerHTML+=`<option>${i}</option>`;
}

/* بعد الحفظ */
function afterSubmit(){
  setTimeout(()=>{
    itemForm.reset();
    loadItems();
  },1500);
}

/* تحميل */
async function loadItems(){
  const r=await fetch(SCRIPT_URL+"?action=list");
  ITEMS=await r.json();
  renderItems(ITEMS);
}

/* عرض القائمة (لم نغيّر المنطق، فقط أضفنا onclick للصورة) */
function renderItems(arr){
  items.innerHTML="";
  if(!arr.length){
    items.innerHTML="لا توجد بيانات";
    return;
  }
  arr.forEach((i,idx)=>{
    items.innerHTML+=`
      <div class="item">
        ${i.image ? `<img src="${i.image}" onclick="showImage('${i.image}')">` : ``}
        <div class="item-name" onclick="fillForm(${idx})">${i.name}</div>
        <div class="item-actions">
          <span onclick="fillForm(${idx})">✏️</span>
        </div>
      </div>
    `;
  });
}

/* تعبئة النموذج (كما هو) */
function fillForm(index){
  const i=ITEMS[index];
  itemName.value=i.name;
  category.value=i.category;
  shelf.value=i.shelf;
  level.value=i.level;
  notes.value=i.notes||"";
}

/* بحث (كما هو) */
function searchByName(){
  const q=searchInput.value.trim();
  renderItems(q?ITEMS.filter(i=>i.name.startsWith(q)):ITEMS);
}

/* معرض الصور (كما هو) */
function openGallery(){
  galleryImages.innerHTML="";
  ITEMS.forEach((i,idx)=>{
    if(i.image){
      galleryImages.innerHTML+=`
        <img src="${i.image}" onclick="fillForm(${idx});closeGallery()">
      `;
    }
  });
  galleryScreen.style.display="block";
}
function closeGallery(){
  galleryScreen.style.display="none";
}

/* ✅ إضافة آمنة: عرض الصورة كبيرة */
function showImage(url){
  viewerImg.src = url;
  imageViewer.style.display = "flex";
}

loadItems();
</script>

</body>
</html>
