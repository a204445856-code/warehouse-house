<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مستودع البيت</title>

<style>
body{font-family:Arial;background:#f5f6f7;padding:20px}
h2{text-align:center}

.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#fff;
padding:15px;
border-radius:8px;
}

input,textarea,select,button{
width:100%;
padding:8px;
margin:6px 0;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
padding:8px 0;
}

.item-right{
display:flex;
align-items:center;
gap:6px;
}

.item img{
width:60px;
height:60px;
object-fit:cover;
border-radius:4px;
}

.btn-edit{background:#f59e0b;color:#fff;border:none;padding:6px 8px;border-radius:4px}
.btn-delete{background:#ef4444;color:#fff;border:none;padding:6px 8px;border-radius:4px}

#gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
gap:10px;
margin-top:10px;
}

#gallery img{
width:100%;
height:120px;
object-fit:cover;
border-radius:6px;
}

/* شاشة القفل */
#lockScreen{
position:fixed;
inset:0;
background:#111827;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.lockBox{
background:#fff;
padding:25px;
border-radius:10px;
width:260px;
text-align:center;
}

.lockIcon{
font-size:22px;
cursor:pointer;
margin-top:8px;
}

#changePassBox{
display:none;
position:fixed;
inset:0;
background:#000000aa;
z-index:10000;
justify-content:center;
align-items:center;
}

#changePassBox .inner{
background:#fff;
padding:20px;
border-radius:10px;
width:260px;
text-align:center;
}

@media(max-width:768px){
.container{grid-template-columns:1fr}
body{padding:12px}
.item img{width:70px;height:70px}
}
</style>
</head>

<body>

<div id="lockScreen">
<div class="lockBox">
<h3>🔐 مستودع البيت</h3>
<input type="password" id="lockPass" placeholder="ادخل كلمة المرور">
<button onclick="unlock()">دخول</button>
<div class="lockIcon" onclick="showChangePass()">🔑</div>
<p id="lockMsg"></p>
</div>
</div>

<div id="changePassBox">
<div class="inner">
<h4>تغيير كلمة المرور</h4>
<input type="password" id="oldPass" placeholder="الحالية">
<input type="password" id="newPass" placeholder="الجديدة">
<button onclick="changePassword()">حفظ</button>
<button onclick="closeChangePass()" style="background:#ef4444;margin-top:6px;">إلغاء</button>
<p id="changeMsg"></p>
</div>
</div>

<h2>📦 مستودع البيت</h2>

<div class="container">

<div class="card">
<h3>إضافة / تعديل</h3>

<input id="name" placeholder="اسم الغرض *">
<label>رقم الرف *</label>
<select id="shelf"></select>

<label>المكان</label>
<select id="place">
<option value="">-- اختر المكان --</option>
<option>البدروم</option>
<option>المطبخ</option>
<option>الصالة</option>
<option>غرفة البنات</option>
<option>غرفة الأولاد</option>
<option>تحت المغسلة</option>
</select>

<textarea id="notes" placeholder="ملاحظات"></textarea>
<input type="file" id="image" accept="image/*">

<button type="button" id="saveBtn">💾 حفظ</button>
<p id="msg"></p>
</div>

<div class="card">
<h3>المحتويات</h3>
<input type="text" id="searchBox" placeholder="🔎 بحث">
<div id="list"></div>
</div>

</div>

<div class="card" style="margin-top:20px">
<h3>🖼️ استديو الصور</h3>
<div id="gallery"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "ضع_بياناتك_الحقيقية",
  authDomain: "ضع_بياناتك_الحقيقية",
  projectId: "warehouse-house",
  storageBucket: "warehouse-house.appspot.com",
  messagingSenderId: "791378856906",
  appId: "ضع_بياناتك_الحقيقية"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let PASSWORD = "";

async function loadPassword(){
const snap = await getDoc(doc(db,"settings","config"));
if(!snap.exists()){
await setDoc(doc(db,"settings","config"),{password:"1234"});
PASSWORD="1234";
}else{
PASSWORD=snap.data().password;
}
}

window.unlock = async function(){
if(document.getElementById("lockPass").value===PASSWORD){
document.getElementById("lockScreen").style.display="none";
}else{
document.getElementById("lockMsg").innerText="كلمة المرور غير صحيحة";
}
}

window.showChangePass = function(){
document.getElementById("changePassBox").style.display="flex";
}

window.closeChangePass = function(){
document.getElementById("changePassBox").style.display="none";
}

window.changePassword = async function(){
const oldP=document.getElementById("oldPass").value;
const newP=document.getElementById("newPass").value;

if(oldP!==PASSWORD){
document.getElementById("changeMsg").innerText="كلمة المرور غير صحيحة";
return;
}

await setDoc(doc(db,"settings","config"),{password:newP});
PASSWORD=newP;
document.getElementById("changeMsg").innerText="تم التغيير لجميع الأجهزة";
}

await loadPassword();
</script>

</body>
</html>
