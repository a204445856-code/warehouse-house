<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
  authDomain: "warehouse-house.firebaseapp.com",
  projectId: "warehouse-house",
  storageBucket: "warehouse-house.appspot.com",
  messagingSenderId: "791378856906",
  appId: "1:791378856906:web:69aa95b1c53e2791865d33"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const nameInput = document.getElementById("name");
const shelfSelect = document.getElementById("shelf");
const placeSelect = document.getElementById("place");
const notesInput = document.getElementById("notes");
const imageInput = document.getElementById("image");
const list = document.getElementById("list");
const msg = document.getElementById("msg");

let editId = null;
let cache = [];

/* أرقام الرفوف 1–100 */
for(let i=1;i<=100;i++){
  const opt=document.createElement("option");
  opt.value=i;
  opt.textContent="رف "+i;
  shelfSelect.appendChild(opt);
}

document.getElementById("saveBtn").onclick = async () => {
  try {
    if (!nameInput.value || !shelfSelect.value) {
      msg.innerText = "❌ الاسم ورقم الرف مطلوبين";
      return;
    }

    let imageUrl = "";

    if (imageInput.files && imageInput.files[0]) {
      const file = imageInput.files[0];
      const imgRef = ref(storage, "images/" + Date.now() + "_" + file.name);
      await uploadBytes(imgRef, file);
      imageUrl = await getDownloadURL(imgRef);
    }

    const data = {
      name: nameInput.value,
      shelf: shelfSelect.value,
      place: placeSelect.value,
      notes: notesInput.value,
      image: imageUrl
    };

    if (editId) {
      const old = cache.find(x => x.id === editId);
      await updateDoc(
        doc(db, "items", editId),
        imageUrl ? data : { ...data, image: old?.image || "" }
      );
      editId = null;
    } else {
      await addDoc(collection(db, "items"), data);
    }

    msg.innerText = "✅ تم الحفظ بنجاح";
    clearForm();
    loadData();

  } catch (err) {
    console.error(err);
    msg.innerText = "❌ خطأ أثناء الحفظ";
  }
};

function clearForm(){
  nameInput.value="";
  shelfSelect.value="";
  placeSelect.value="";
  notesInput.value="";
  imageInput.value="";
  msg.innerText="";
}

async function loadData(){
  list.innerHTML="";
  cache=[];
  const snap=await getDocs(collection(db,"items"));

  snap.forEach(d=>{
    const x={id:d.id,...d.data()};
    cache.push(x);

    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <div>
        <b>${x.name}</b><br>
        رف ${x.shelf} - ${x.place||""}
      </div>
      <div class="item-right">
        ${x.image?`<img src="${x.image}" onclick="editItem('${x.id}')">`:""}
        <button class="btn-edit" onclick="editItem('${x.id}')">✏️</button>
        <button class="btn-delete" onclick="deleteItem('${x.id}')">🗑️</button>
      </div>
    `;
    list.appendChild(div);
  });
}

window.editItem=function(id){
  const x=cache.find(i=>i.id===id);
  if(!x)return;

  nameInput.value=x.name;
  shelfSelect.value=x.shelf;
  placeSelect.value=x.place;
  notesInput.value=x.notes;
  editId=id;
  window.scrollTo({top:0,behavior:"smooth"});
};

window.deleteItem=async function(id){
  if(confirm("هل تريد حذف هذا العنصر؟")){
    await deleteDoc(doc(db,"items",id));
    loadData();
  }
};

loadData();
</script>
