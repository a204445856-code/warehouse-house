<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📦 مستودع البيت</title>

<style>
body{
  margin:0;
  font-family:Tahoma, Arial;
  background:#f6f7fb;
}
header{
  background:#fff;
  padding:12px;
  border-bottom:1px solid #ddd;
}
main{
  max-width:1100px;
  margin:auto;
  padding:16px;
}
.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin-bottom:16px;
}
h2{margin-top:0}

input, select, textarea, button{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  cursor:pointer;
  border:none;
  font-weight:bold;
}

.save{background:#2563eb;color:#fff}
.clear{background:#9ca3af;color:#fff}

.item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:8px;
}

.actions{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.edit{
  background:#f59e0b;
  color:#fff;
  font-size:12px;
  padding:6px;
  border-radius:6px;
}

.delete{
  background:#ef4444;
  color:#fff;
  font-size:12px;
  padding:6px;
  border-radius:6px;
}
</style>
</head>

<body>
<header>
<h1>📦 مستودع البيت</h1>
</header>

<main>

<div class="card">
<h2>إضافة غرض</h2>

<input id="name" placeholder="اسم الغرض *">
<input id="category" placeholder="التصنيف">
<select id="shelf"></select>
<select id="side">
  <option value="">الجهة</option>
  <option>يمين</option>
  <option>يسار</option>
</select>
<select id="level">
  <option value="">المستوى</option>
  <option>علوي</option>
  <option>وسط</option>
  <option>سفلي</option>
</select>
<textarea id="notes" placeholder="ملاحظات"></textarea>

<button class="save" onclick="save()">💾 حفظ</button>
<button class="clear" onclick="clearForm()">مسح</button>
</div>

<div class="card">
<h2>العرض</h2>
<div id="list"></div>
</div>

</main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyg8Z2xLXWVvrnHw4PdvlWrC0H1C3qsJe-EheRGazo0Ad3zuxm3QXHc0V2e3FgHYWbO/exec";

let editingId = null;

// إنشاء قائمة الرفوف 1–50
const shelfSel = document.getElementById("shelf");
shelfSel.innerHTML = `<option value="">رقم الرف</option>`;
for(let i=1;i<=50;i++){
  shelfSel.innerHTML += `<option>${i}</option>`;
}

async function apiGet(){
  const res = await fetch(SCRIPT_URL);
  return res.json();
}

async function apiPost(data){
  const res = await fetch(SCRIPT_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
  });
  return res.json();
}

async function load(){
  const items = await apiGet();
  render(items);
}

function render(items){
  const list = document.getElementById("list");
  list.innerHTML = "";
  items.forEach(i=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = `
      <div>
        <b>${i.name}</b><br>
        رف ${i.shelf || "-"} / ${i.side || "-"} / ${i.level || "-"}
      </div>
      <div class="actions">
        <button class="edit" onclick="editItem('${i.id}')">تعديل</button>
        <button class="delete" onclick="deleteItem('${i.id}')">حذف</button>
      </div>
    `;
    list.appendChild(div);
  });
}

async function save(){
  if(!name.value.trim()){
    alert("اسم الغرض مطلوب");
    return;
  }

  await apiPost({
    action: editingId ? "update" : "add",
    id: editingId,
    name: name.value,
    category: category.value,
    shelf: shelf.value,
    side: side.value,
    level: level.value,
    notes: notes.value
  });

  clearForm();
  load();
}

function clearForm(){
  document.querySelectorAll("input,select,textarea").forEach(i=>i.value="");
  editingId=null;
}

async function editItem(id){
  const items = await apiGet();
  const o = items.find(x=>x.id===id);
  if(!o) return;

  editingId=id;
  name.value=o.name;
  category.value=o.category;
  shelf.value=o.shelf;
  side.value=o.side;
  level.value=o.level;
  notes.value=o.notes;
}

async function deleteItem(id){
  if(!confirm("حذف الغرض؟")) return;
  await apiPost({action:"delete", id});
  load();
}

load();
</script>

</body>
</html>
