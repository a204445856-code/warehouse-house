<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{margin:0;background:#f3f4f6}
header{
  background:#fff;
  padding:15px 25px;
  font-size:22px;
  font-weight:bold;
  border-bottom:1px solid #e5e7eb
}

.container{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:20px;
  padding:20px
}

.card{
  background:#fff;
  border-radius:10px;
  padding:20px;
  box-shadow:0 1px 4px rgba(0,0,0,.08)
}

/* ===== القائمة ===== */
.search{
  margin-bottom:15px
}
.search input{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px
}

.item{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
  border:1px solid #eee;
  border-radius:10px;
  margin-bottom:10px
}
.item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
  background:#eee
}
.item-info{
  flex:1
}
.item-info b{
  display:block;
  margin-bottom:4px
}
.item-actions{
  display:flex;
  flex-direction:column;
  gap:6px
}
.item-actions button{
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  color:#fff;
  font-size:13px
}
.edit{background:#f59e0b}
.delete{background:#ef4444}

/* ===== النموذج ===== */
label{
  font-size:13px;
  color:#374151;
  margin-top:10px;
  display:block
}
input,select,textarea{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fff;
  color:#111
}
textarea{resize:none;height:80px}

/* ✅ إصلاح القوائم المنسدلة */
select{
  appearance:auto;
  -webkit-appearance:auto;
  -moz-appearance:auto;
  background-color:#fff;
  color:#111;
  cursor:pointer
}
select:focus{
  outline:2px solid #2563eb;
}

/* ===== الأزرار ===== */
.buttons{
  display:flex;
  gap:10px;
  margin-top:15px
}
.save{
  background:#2563eb;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:8px;
  flex:1;
  cursor:pointer
}
.clear{
  background:#9ca3af;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:8px;
  flex:1;
  cursor:pointer
}
.sync{
  background:#111827;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:8px;
  flex:1;
  cursor:pointer
}

/* ===== ملاحظة ===== */
.note{
  margin-top:10px;
  font-size:12px;
  color:#6b7280
}

@media(max-width:900px){
  .container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

  <!-- القائمة -->
  <div class="card">
    <div class="search">
      <input placeholder="ابحث بالاسم أو رقم الرف">
    </div>

    <div class="item">
      <img>
      <div class="item-info">
        <b>مثال</b>
        رف - 1
      </div>
      <div class="item-actions">
        <button class="delete">حذف</button>
        <button class="edit">تعديل</button>
      </div>
    </div>

  </div>

  <!-- الإدخال -->
  <div class="card">
    <label>اسم الغرض *</label>
    <input>

    <label>التصنيف (اختياري)</label>
    <input placeholder="أدوات / كهرباء / مطبخ">

    <label>الجهة</label>
    <select>
      <option value="">اختر</option>
      <option>يمين</option>
      <option>يسار</option>
    </select>

    <label>رقم الرف *</label>
    <input value="8">

    <label>المستوى</label>
    <select>
      <option value="">اختر</option>
      <option>أعلى</option>
      <option>وسط</option>
      <option>أسفل</option>
    </select>

    <label>منطقة / قسم</label>
    <select>
      <option value="">اختر</option>
      <option>المستودع</option>
      <option>المطبخ</option>
      <option>الصالة</option>
    </select>

    <label>ملاحظات</label>
    <textarea></textarea>

    <label>صورة (اختياري)</label>
    <input type="file">

    <div class="buttons">
      <button class="save">حفظ</button>
      <button class="clear">مسح الحقول</button>
      <button class="sync">تحديث من السحابة</button>
    </div>

    <div class="note">
      التخزين يتم في Google Sheets + الصور في Google Drive (تظهر على كل الأجهزة)
    </div>
  </div>

</div>

</body>
</html>
