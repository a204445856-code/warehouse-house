<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📦 مستودع البيت</title>

<style>
body{font-family:tahoma;background:#f5f7fb;margin:0}
header{background:#fff;padding:14px;border-bottom:1px solid #ddd;font-size:20px}
main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:16px}
input,select,textarea,button{width:100%;padding:10px;margin-bottom:10px}
button{background:#2563eb;color:#fff;border:none;border-radius:8px}
.msg{padding:10px;margin-top:10px;border-radius:8px}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.item{border:1px solid #ddd;padding:10px;border-radius:10px;margin-bottom:8px}
.actions{display:flex;gap:6px}
.actions button{font-size:12px;padding:6px}
</style>
</head>

<body>
<header>📦 مستودع البيت</header>

<main>

<div class="card">
<h3>إضافة غرض</h3>

<input id="name" placeholder="اسم الغرض *">
<input id="category" placeholder="التصنيف">

<select id="shelf">
<option value="">رقم الرف</option>
<script>
for(let i=1;i<=50;i++)document.write(`<option>${i}</option>`);
</script>
</select>

<input id="side" placeholder="الجهة">
<input id="level" placeholder="المستوى">
<input id="zone" placeholder="منطقة / قسم">

<textarea id="notes" placeholder="ملاحظات"></textarea>

<input type="file" id="image">

<button onclick="save()">💾 حفظ</button>
<div id="msg"></div>
</div>

<div class="card">
<h3>العرض</h3>
<div id="list"></div>
</div>

</main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxr-KERLIww6mrFGgRuXBNfrmFTeDA_JNs_syEwXzT-c7nXzCREcTZYty6vSxZG4gOb/exec";

function showMsg(t,ok=true){
  msg.className="msg "+(ok?"ok":"err");
  msg.innerText=t;
}

async function save(){
  if(!name.value) return showMsg("اسم الغرض مطلوب",false);

  let payload={
    name:name.value,
    category:category.value,
    shelf:shelf.value,
    side:side.value,
    level:level.value,
    zone:zone.value,
    notes:notes.value,
    image:""
  };

  if(image.files[0]){
    const r=new FileReader();
    r.onload=e=>{
      payload.image=e.target.result;
      send(payload);
    };
    r.readAsDataURL(image.files[0]);
  }else{
    send(payload);
  }
}

async function send(payload){
  try{
    const body=new URLSearchParams();
    body.set("payload",JSON.stringify(payload));

    const res=await fetch(SCRIPT_URL,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body
    });
    const j=await res.json();
    showMsg("تم الحفظ بنجاح ✅");
    load();
  }catch(e){
    showMsg("لم يرسل للسحابة ❌",false);
  }
}

async function load(){
  const res=await fetch(SCRIPT_URL);
  const data=await res.json();
  list.innerHTML="";
  data.forEach(i=>{
    list.innerHTML+=`
    <div class="item">
      <b>${i.name}</b><br>
      رف ${i.shelf} - ${i.side} - ${i.level}
    </div>`;
  });
}

load();
</script>

</body>
</html>
