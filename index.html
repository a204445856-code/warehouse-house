<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
body{
  font-family: Tahoma, Arial;
  background:#f5f6f7;
  margin:0;
}
header{
  text-align:center;
  padding:20px;
  font-size:26px;
}
.container{
  display:flex;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}
.card{
  background:#fff;
  border-radius:10px;
  padding:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  flex:1;
  min-width:300px;
}
input, select, textarea, button{
  width:100%;
  padding:8px;
  margin-top:6px;
  font-size:14px;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:10px;
  cursor:pointer;
}
.icons{
  display:flex;
  gap:10px;
  font-size:20px;
  cursor:pointer;
}
.item{
  border-bottom:1px solid #eee;
  padding:8px 0;
}
img{
  max-width:100%;
  border-radius:6px;
  margin-top:5px;
  cursor:pointer;
}

/* نافذة عامة */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:1000;
}
.modal-content{
  background:#fff;
  padding:15px;
  border-radius:10px;
  max-width:420px;
  margin:10% auto;
}
.close{
  text-align:left;
  cursor:pointer;
}
.gallery img{
  width:80px;
  height:80px;
  object-fit:cover;
  margin:5px;
}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

<!-- القائمة -->
<div class="card">
  <div class="icons">
    🔍 <input id="searchInput" placeholder="بحث بالاسم" oninput="searchByName()">
    🖼️ <span onclick="openGallery()">معرض الصور</span>
  </div>

  <div id="items">جاري التحميل...</div>
</div>

<!-- النموذج -->
<div class="card">
  <h3>إضافة غرض</h3>

  <input id="name" placeholder="اسم الغرض">

  <select id="category">
    <option value="">اختر المنطقة / القسم</option>
    <option>مستودع يمين</option>
    <option>مستودع يسار</option>
    <option>مطبخ</option>
    <option>صالة</option>
    <option>غرفة البنات</option>
    <option>غرفة الأولاد</option>
    <option>غرفة النوم</option>
  </select>

  <select id="shelf"><option value="">اختر رقم الرف</option></select>

  <select id="level">
    <option value="">اختر المستوى</option>
    <option>أعلى</option>
    <option>وسط</option>
    <option>أسفل</option>
  </select>

  <textarea id="notes" placeholder="ملاحظات"></textarea>
  <input type="file" id="image">

  <button onclick="saveItem()">حفظ</button>
</div>

</div>

<!-- نافذة البيانات -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <div class="close" onclick="closeModal()">✖</div>
    <img id="mImg">
    <p><b id="mName"></b></p>
    <p id="mInfo"></p>
    <p id="mNotes"></p>
  </div>
</div>

<!-- نافذة معرض الصور -->
<div class="modal" id="galleryModal">
  <div class="modal-content gallery">
    <div class="close" onclick="galleryModal.style.display='none'">✖</div>
    <div id="galleryImages"></div>
  </div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzHNkErFAkv9y7kD9OyDoimgxsQJyxZTgoDsUE6nUpIyxaBTQUcMIbMTSnzV8TGXwmh/exec";

let ITEMS = [];

/* تعبئة الأرفف */
for(let i=1;i<=100;i++){
  shelf.innerHTML+=`<option>${i}</option>`;
}

async function saveItem(){
  const fd=new FormData();
  fd.append("name",name.value);
  fd.append("category",category.value);
  fd.append("shelf",shelf.value);
  fd.append("level",level.value);
  fd.append("notes",notes.value);
  if(image.files[0]) fd.append("image",image.files[0]);

  const r=await fetch(SCRIPT_URL,{method:"POST",body:fd});
  const j=await r.json();
  if(j.status==="success"){
    name.value=category.value=shelf.value=level.value=notes.value="";
    image.value="";
    loadItems();
  }
}

async function loadItems(){
  const r=await fetch(SCRIPT_URL+"?action=list");
  ITEMS=await r.json();
  renderItems(ITEMS);
}

function renderItems(arr){
  items.innerHTML="";
  if(!arr.length){items.innerHTML="لا توجد بيانات";return;}
  arr.forEach((i,idx)=>{
    items.innerHTML+=`
      <div class="item">
        <b>${i.name}</b><br>
        ${i.category} | رف ${i.shelf} | ${i.level}
      </div>`;
  });
}

function searchByName(){
  const q=searchInput.value.trim();
  renderItems(
    ITEMS.filter(i=>i.name.includes(q))
  );
}

/* ===== معرض الصور ===== */
function openGallery(){
  galleryImages.innerHTML="";
  ITEMS.forEach((i,idx)=>{
    if(i.image){
      galleryImages.innerHTML+=`
        <img src="${i.image}" onclick="showDetails(${idx})">
      `;
    }
  });
  galleryModal.style.display="block";
}

function showDetails(index){
  const i=ITEMS[index];
  galleryModal.style.display="none";
  detailModal.style.display="block";
  mImg.src=i.image;
  mName.textContent=i.name;
  mInfo.textContent=`${i.category} | رف ${i.shelf} | ${i.level}`;
  mNotes.textContent=i.notes||"";
}

function closeModal(){
  detailModal.style.display="none";
}

loadItems();
</script>

</body>
</html>
