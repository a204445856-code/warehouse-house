<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستودع البيت</title>

<style>
body{
  font-family:Tahoma,Arial;
  background:#f5f6f7;
  margin:0;
}
header{
  text-align:center;
  padding:20px;
  font-size:26px;
}
.container{
  display:flex;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}
.card{
  background:#fff;
  border-radius:10px;
  padding:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  flex:1;
  min-width:300px;
}
input,select,textarea,button{
  width:100%;
  padding:8px;
  margin-top:6px;
  font-size:14px;
}
button{
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:10px;
  cursor:pointer;
}
.top-bar{
  display:flex;
  gap:10px;
  align-items:center;
}
.icon-btn{
  font-size:20px;
  cursor:pointer;
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:6px 10px;
}
.item{
  border-bottom:1px solid #eee;
  padding:8px 0;
  cursor:pointer;
}
.item:hover{background:#f0f2f5}

/* معرض الصور */
.gallery-screen{
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:1000;
  overflow:auto;
  padding:20px;
}
.gallery{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.gallery img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:6px;
  cursor:pointer;
}
.close{
  font-size:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>📦 مستودع البيت</header>

<div class="container">

<!-- القائمة + البحث -->
<div class="card">
  <div class="top-bar">
    <input id="searchInput" placeholder="🔍 ابحث بالاسم..." oninput="searchByName()">
    <button class="icon-btn" onclick="openGallery()">🖼️</button>
  </div>
  <div id="items">جاري التحميل...</div>
</div>

<!-- الإدخال -->
<div class="card">
  <h3>إضافة / عرض غرض</h3>

  <input id="itemName" placeholder="اسم الغرض">

  <select id="category">
    <option value="">المنطقة / القسم</option>
    <option>مستودع يمين</option>
    <option>مستودع يسار</option>
    <option>مطبخ</option>
    <option>صالة</option>
    <option>غرفة البنات</option>
    <option>غرفة الأولاد</option>
    <option>غرفة النوم</option>
  </select>

  <select id="shelf"><option value="">رقم الرف</option></select>

  <select id="level">
    <option value="">المستوى</option>
    <option>أعلى</option>
    <option>وسط</option>
    <option>أسفل</option>
  </select>

  <textarea id="notes" placeholder="ملاحظات"></textarea>
  <input type="file" id="image">

  <button onclick="saveItem()">حفظ</button>
</div>

</div>

<!-- شاشة معرض الصور -->
<div class="gallery-screen" id="galleryScreen">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3>🖼️ معرض الصور</h3>
    <span class="close" onclick="closeGallery()">✖</span>
  </div>
  <div class="gallery" id="galleryImages"></div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyOEyeIgyvubIw5A3dpWIC93eLs3Zn9EJ7o5hJhqPgBYfJy84lYIcKRay7bXUoB7W61/exec";

let ITEMS=[];

/* تعبئة الأرفف */
for(let i=1;i<=100;i++){shelf.innerHTML+=`<option>${i}</option>`}

async function saveItem(){
  const nameValue=itemName.value.trim();
  if(!nameValue){alert("اسم الغرض مطلوب");return}

  const fd=new FormData();
  fd.append("name",nameValue);
  fd.append("category",category.value);
  fd.append("shelf",shelf.value);
  fd.append("level",level.value);
  fd.append("notes",notes.value);
  if(image.files[0]) fd.append("image",image.files[0]);

  const r=await fetch(SCRIPT_URL,{method:"POST",body:fd});
  const j=await r.json();

  if(j.status==="success"){
    itemName.value="";
    category.value="";
    shelf.value="";
    level.value="";
    notes.value="";
    image.value="";
    loadItems();
  }else{
    alert("فشل الحفظ");
  }
}

async function loadItems(){
  const r=await fetch(SCRIPT_URL+"?action=list");
  ITEMS=await r.json();
  renderItems(ITEMS);
}

function renderItems(arr){
  items.innerHTML="";
  if(!arr.length){items.innerHTML="لا توجد بيانات";return}
  arr.forEach(i=>{
    items.innerHTML+=`<div class="item">${i.name}</div>`;
  });
}

function searchByName(){
  const q=searchInput.value.trim();
  renderItems(q?ITEMS.filter(i=>i.name.startsWith(q)):ITEMS);
}

/* ===== معرض الصور ===== */
function openGallery(){
  galleryImages.innerHTML="";
  ITEMS.forEach(i=>{
    if(i.image){
      galleryImages.innerHTML+=`
        <img src="${i.image}" onclick="selectFromGallery('${i.name}')">
      `;
    }
  });
  galleryScreen.style.display="block";
}

function selectFromGallery(name){
  const i=ITEMS.find(x=>x.name===name);
  if(!i)return;
  galleryScreen.style.display="none";
  itemName.value=i.name;
  category.value=i.category;
  shelf.value=i.shelf;
  level.value=i.level;
  notes.value=i.notes||"";
}

function closeGallery(){
  galleryScreen.style.display="none";
}

loadItems();
</script>

</body>
</html>
