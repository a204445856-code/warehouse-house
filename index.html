 <!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📦 مستودع البيت</title>

<style>
body{margin:0;font-family:Tahoma;background:#f6f7fb}
header{background:#fff;padding:14px;border-bottom:1px solid #ddd}
main{padding:16px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:12px;padding:14px;border:1px solid #ddd;margin-bottom:16px}
input,select,textarea,button{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:6px
}
button{cursor:pointer;font-weight:bold;background:#2563eb;color:#fff}
.item{display:flex;gap:10px;align-items:center;border:1px solid #ddd;padding:10px;border-radius:10px;margin-top:10px}
img{width:50px;height:50px;border-radius:8px;object-fit:cover}
.row{display:grid;gap:10px}
@media(min-width:600px){.row{grid-template-columns:1fr 1fr}}
</style>
</head>

<body>
<header><h2>📦 مستودع البيت</h2></header>

<main>

<div class="card">
<h3>إضافة غرض</h3>

<input type="hidden" id="editIndex">

<label>اسم الغرض *</label>
<input id="name">

<label>التصنيف</label>
<select id="category">
  <option value="">اختر التصنيف</option>
  <option>أدوات</option>
  <option>كهرباء</option>
  <option>مطبخ</option>
  <option>سباكة</option>
  <option>تنظيف</option>
</select>

<div class="row">
  <div>
    <label>رقم الرف *</label>
    <select id="shelf">
      <option value="">اختر</option>
      <option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option>
    </select>
  </div>

  <div>
    <label>الجهة</label>
    <select id="side">
      <option value="">اختر</option>
      <option>يمين</option>
      <option>يسار</option>
      <option>وسط</option>
    </select>
  </div>
</div>

<div class="row">
  <div>
    <label>المستوى</label>
    <select id="level">
      <option value="">اختر</option>
      <option>علوي</option>
      <option>متوسط</option>
      <option>سفلي</option>
    </select>
  </div>

  <div>
    <label>منطقة / قسم</label>
    <select id="zone">
      <option value="">اختر</option>
      <option>البيت</option>
      <option>الملحق</option>
      <option>المخزن</option>
      <option>الكراج</option>
    </select>
  </div>
</div>

<label>ملاحظات</label>
<textarea id="notes"></textarea>

<label>صورة</label>
<input id="image" type="file" accept="image/*">

<button onclick="save()">💾 حفظ</button>
</div>

<div class="card">
<h3>العرض</h3>
<div id="list"></div>
</div>

</main>

<script>
const el=id=>document.getElementById(id);
const nameEl=el("name"),catEl=el("category"),shelfEl=el("shelf"),
sideEl=el("side"),levelEl=el("level"),zoneEl=el("zone"),
notesEl=el("notes"),imageEl=el("image"),editIndexEl=el("editIndex"),
listEl=el("list");

let items=JSON.parse(localStorage.getItem("warehouse_items")||"[]");

function save(){
  if(!nameEl.value) return alert("اسم الغرض مطلوب");
  const obj={
    name:nameEl.value,
    category:catEl.value,
    shelf:shelfEl.value,
    side:sideEl.value,
    level:levelEl.value,
    zone:zoneEl.value,
    notes:notesEl.value,
    image:"",
    date:new Date().toLocaleString("ar-SA")
  };

  const idx=editIndexEl.value;
  const file=imageEl.files[0];

  if(file){
    const r=new FileReader();
    r.onload=e=>{obj.image=e.target.result;finish(obj,idx)};
    r.readAsDataURL(file);
  }else finish(obj,idx);
}

function finish(obj,idx){
  if(idx==="") items.push(obj);
  else items[idx]=obj;

  localStorage.setItem("warehouse_items",JSON.stringify(items));
  clearForm(); render();
}

function render(){
  listEl.innerHTML="";
  items.forEach((i,idx)=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      <img src="${i.image||'https://via.placeholder.com/50'}">
      <div>
        <b>${i.name}</b><br>
        رف ${i.shelf} - ${i.side} - ${i.level}<br>
        ${i.category} / ${i.zone}
      </div>
      <button onclick="del(${idx})">🗑️</button>`;
    listEl.appendChild(d);
  });
}

function del(i){
  if(confirm("حذف؟")){
    items.splice(i,1);
    localStorage.setItem("warehouse_items",JSON.stringify(items));
    render();
  }
}

function clearForm(){
  [nameEl,catEl,shelfEl,sideEl,levelEl,zoneEl,notesEl,imageEl].forEach(e=>e.value="");
  editIndexEl.value="";
}

render();
</script>

</body>
</html>
