<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نظام إدارة المستودع</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #f4f6f8;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .container {
      background: #ffffff;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      margin-top: 10px;
      display: block;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background: #2e86de;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1e5fa3;
    }
  </style>
</head>
<body>

<h1>إدارة المستودع</h1>

<div class="container">
  <label>اسم الصنف</label>
  <input type="text" id="name">

  <label>التصنيف</label>
  <input type="text" id="category">

  <label>رقم الرف</label>
  <input type="text" id="shelf">

  <label>الجهة</label>
  <input type="text" id="side">

  <label>المستوى</label>
  <input type="text" id="level">

  <label>المنطقة</label>
  <input type="text" id="zone">

  <label>ملاحظات</label>
  <textarea id="notes"></textarea>

  <button onclick="saveItem()">حفظ</button>
</div>

<script>
const scriptURL =
"https://script.google.com/macros/s/AKfycbwTqZ7DEzN_Ct-aDoeLmKS2HgzZIhAPwte2glHAu3yXj5H8rL6zLo7hGyod4Pt-Lqqd/exec";

function saveItem() {
  const data = {
    name: document.getElementById("name").value,
    category: document.getElementById("category").value,
    shelf: document.getElementById("shelf").value,
    side: document.getElementById("side").value,
    level: document.getElementById("level").value,
    zone: document.getElementById("zone").value,
    notes: document.getElementById("notes").value,
    image_url: ""
  };

  fetch(scriptURL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => {
    alert("✅ تم حفظ البيانات بنجاح");
    document.querySelectorAll("input, textarea").forEach(el => el.value = "");
  })
  .catch(err => {
    console.error(err);
    alert("❌ حدث خطأ أثناء الحفظ");
  });
}
</script>

</body>
</html>
