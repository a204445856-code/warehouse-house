<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مستودع البيت</title>

<style>
body{
  font-family: Arial;
  background:#f5f6f7;
  padding:20px;
}
h2{text-align:center}

.container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:8px;
}

input, textarea, select, button{
  width:100%;
  padding:8px;
  margin:6px 0;
}

button{cursor:pointer}

#list{
  max-height:420px;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:8px 0;
}

.item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
  cursor:pointer;
}

#gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
  margin-top:10px;
}

#gallery img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:6px;
  cursor:pointer;
}

@media(max-width:768px){
  .container{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h2>📦 مستودع البيت</h2>

<div class="container">

<div class="card">
<h3>إضافة / تعديل</h3>

<input id="name" placeholder="اسم الغرض *">

<label>رقم الرف *</label>
<select id="shelf"></select>

<label>المكان</label>
<select id="place">
<option value="">-- اختر المكان --</option>
<option>البدروم</option>
<option>رف أيمن</option>
<option>رف أيسر</option>
<option>رف أمام</option>
<option>المطبخ</option>
<option>غرفة البنات</option>
<option>غرفة الأولاد</option>
<option>الصالة</option>
<option>تحت المغسلة</option>
<option>غرفتي</option>
<option>استقبال</option>
<option>استقبال البيت</option>
</select>

<textarea id="notes" placeholder="ملاحظات"></textarea>

<input type="file" id="image" accept="image/*">

<button id="saveBtn">💾 حفظ</button>
<p id="msg"></p>
</div>

<div class="card">
<h3>المحتويات</h3>
<div id="list"></div>
</div>

</div>

<div class="card" style="margin-top:20px">
<h3>🖼️ استديو الصور</h3>
<div id="gallery"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
  authDomain: "warehouse-house.firebaseapp.com",
  projectId: "warehouse-house",
  storageBucket: "warehouse-house.firebasestorage.app",
  messagingSenderId: "791378856906",
  appId: "1:791378856906:web:69aa95b1c53e2791865d33"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const nameInput=document.getElementById("name");
const shelfSelect=document.getElementById("shelf");
const placeSelect=document.getElementById("place");
const notesInput=document.getElementById("notes");
const imageInput=document.getElementById("image");
const list=document.getElementById("list");
const gallery=document.getElementById("gallery");
const msg=document.getElementById("msg");

let editId=null;
let cache=[];

for(let i=1;i<=100;i++){
  const opt=document.createElement("option");
  opt.value=i;
  opt.textContent="رف "+i;
  shelfSelect.appendChild(opt);
}

document.getElementById("saveBtn").onclick=async()=>{
  if(!nameInput.value||!shelfSelect.value){
    msg.innerText="❌ الاسم ورقم الرف مطلوبين";
    return;
  }

  try{

    let imageUrl="";
    let file=imageInput.files[0];

    if(file){
      const imgRef=ref(storage,"images/"+Date.now()+"_"+file.name);
      await uploadBytes(imgRef,file);
      imageUrl=await getDownloadURL(imgRef);
    }

    const data={
      name:nameInput.value,
      shelf:shelfSelect.value,
      place:placeSelect.value,
      notes:notesInput.value,
      image:imageUrl
    };

    if(editId){
      await updateDoc(doc(db,"items",editId),data);
      editId=null;
    }else{
      await addDoc(collection(db,"items"),data);
    }

    loadData();
    msg.innerText="✅ تم الحفظ";

  }catch(e){
    console.error(e);
    msg.innerText="❌ خطأ في رفع الصورة";
  }
};

async function loadData(){
  list.innerHTML="";
  gallery.innerHTML="";
  cache=[];

  const snap=await getDocs(collection(db,"items"));
  snap.forEach(d=>{
    const x={id:d.id,...d.data()};
    cache.push(x);

    const div=document.createElement("div");
    div.className="item";

    div.innerHTML=`
      <div>
        <b>${x.name}</b><br>
        رف ${x.shelf} - ${x.place||""}
      </div>
      <div>
        ${x.image ? `<img src="${x.image}" onclick="event.stopPropagation(); editItem('${x.id}')">` : ""}
      </div>
    `;

    div.onclick=()=>editItem(x.id);
    list.appendChild(div);

    if(x.image){
      const img=document.createElement("img");
      img.src=x.image;
      img.onclick=()=>editItem(x.id);
      gallery.appendChild(img);
    }
  });
}

window.editItem=id=>{
  const x=cache.find(i=>i.id===id);
  if(!x)return;
  nameInput.value=x.name;
  shelfSelect.value=x.shelf;
  placeSelect.value=x.place;
  notesInput.value=x.notes;
  editId=id;
  window.scrollTo({top:0,behavior:"smooth"});
};

loadData();
</script>

</body>
</html>
