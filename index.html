<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>

<style>
body {
  direction: rtl;
  font-family: Arial;
  background: #f4f6f8;
  margin: 0;
}
.header {
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
}
.container {
  display: flex;
  gap: 20px;
  padding: 15px;
}
.left {
  width: 30%;
}
.right {
  width: 70%;
}
.card {
  background: #fff;
  padding: 15px;
  border-radius: 8px;
}
.item {
  border: 1px solid #ddd;
  padding: 10px;
  margin-bottom: 10px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.item:hover {
  background: #f0f0f0;
}
button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
.delete {
  background: #ef4444;
  color: #fff;
}
.edit {
  background: #f59e0b;
  color: #fff;
}
input, textarea {
  width: 100%;
  padding: 6px;
  margin: 5px 0;
}
.save {
  background: #2563eb;
  color: #fff;
}
img {
  max-width: 100%;
  margin-top: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="header">📦 مستودع البيت</div>

<div class="container">

  <!-- القائمة -->
  <div class="left">
    <div class="card">
      <input placeholder="ابحث بالاسم أو رقم الرف">
      <div id="itemsList"></div>
    </div>
  </div>

  <!-- التفاصيل -->
  <div class="right">
    <div class="card">
      <input id="name" placeholder="اسم الغرض">
      <input id="category" placeholder="التصنيف">
      <input id="shelf" placeholder="رقم الرف">
      <input id="side" placeholder="الجهة">
      <input id="level" placeholder="المستوى">
      <input id="zone" placeholder="المنطقة">
      <textarea id="notes" placeholder="ملاحظات"></textarea>

      <input id="image_url" placeholder="رابط الصورة (اختياري)">

      <button class="save" type="button" onclick="saveItem()">حفظ</button>

      <hr>

      <h3 id="viewName">اختر غرضًا</h3>
      <p id="viewLocation"></p>
      <p id="viewNotes"></p>
      <img id="viewImage" style="display:none;">
    </div>
  </div>

</div>

<script>
const scriptURL =
"https://script.google.com/macros/s/AKfycbxqbICXqRgJ7OT8WFQH9cd-6lFN75vONOR-Fzrf87w2Mt_g1dBfkZhZ6UPyvbSrAZ49/exec";

let items = [];

function loadItems() {
  fetch(scriptURL)
    .then(r => r.json())
    .then(data => {
      items = data;
      itemsList.innerHTML = "";
      data.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <span>${item.name}</span>
          <span>رف ${item.shelf}</span>
        `;
        div.onclick = () => showItem(index);
        itemsList.appendChild(div);
      });
    });
}

function showItem(index) {
  const i = items[index];
  viewName.textContent = i.name;
  viewLocation.textContent = `الموقع: رف ${i.shelf} – ${i.zone}`;
  viewNotes.textContent = i.notes || "";

  if (i.image_url) {
    viewImage.src = i.image_url;
    viewImage.style.display = "block";
  } else {
    viewImage.style.display = "none";
  }
}

function saveItem() {
  const data = {
    name: name.value,
    category: category.value,
    shelf: shelf.value,
    side: side.value,
    level: level.value,
    zone: zone.value,
    notes: notes.value,
    image_url: image_url.value
  };

  fetch(scriptURL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  alert("✅ تم حفظ الغرض في السحابة");

  clearForm();
  setTimeout(loadItems, 1000);
}

function clearForm() {
  document.querySelectorAll("input, textarea").forEach(e => e.value = "");
}

loadItems();
</script>

</body>
</html>
