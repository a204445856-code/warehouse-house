<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>

<style>
body{
  font-family: Tahoma;
  background:#f2f2f2;
  margin:0;
  padding:20px
}
h1{text-align:center}
.container{
  display:flex;
  gap:20px
}
.card{
  background:#fff;
  border-radius:10px;
  padding:15px;
  flex:1
}
input,select,textarea,button{
  width:100%;
  padding:8px;
  margin:5px 0
}
button{
  background:#2d6cdf;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer
}
.item{
  border:1px solid #ddd;
  padding:10px;
  border-radius:8px;
  margin-bottom:10px
}
.actions{
  display:flex;
  gap:5px;
  margin-top:5px
}
.edit{background:#f39c12}
.delete{background:#e74c3c}
.view{background:#16a085}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center
}
.modal-content{
  background:#fff;
  padding:15px;
  border-radius:10px;
  max-width:400px;
  width:90%
}
.modal img{
  width:100%;
  border-radius:8px;
  margin-top:10px
}
</style>
</head>

<body>

<h1>📦 مستودع البيت</h1>
<button onclick="openGallery()">📷 استعراض الصور</button>

<div class="container">

<!-- النموذج -->
<div class="card">
  <input id="name" placeholder="اسم الغرض">

  <select id="category">
    <option value="">التصنيف</option>
    <option>كهرباء</option>
    <option>مطبخ</option>
    <option>أدوات</option>
  </select>

  <select id="shelf">
    <option value="">رقم الرف</option>
    <script>
      for(let i=1;i<=50;i++)document.write(`<option>${i}</option>`)
    </script>
  </select>

  <select id="side">
    <option value="">الجهة</option>
    <option>يمين</option>
    <option>يسار</option>
  </select>

  <select id="level">
    <option value="">المستوى</option>
    <option>علوي</option>
    <option>سفلي</option>
  </select>

  <select id="zone">
    <option value="">المنطقة</option>
    <option>المخزن</option>
    <option>المطبخ</option>
  </select>

  <textarea id="notes" placeholder="ملاحظات"></textarea>

  <input type="file" id="image" accept="image/*" capture="environment">

  <button onclick="save()">حفظ</button>
</div>

<!-- القائمة -->
<div class="card">
  <input id="search" placeholder="بحث بالاسم أو رقم الرف">
  <div id="list"></div>
</div>

</div>

<!-- نافذة عرض الصورة -->
<div class="modal" id="modal" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div id="modalBody"></div>
    <button onclick="closeModal()">إغلاق</button>
  </div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbyn2fdActNwl0niZeBvgy9J2Vu74EKdfG9dEt4uk9gQS5-5YrSF3TwgcKEzG1_Nvplc/exec";

let items=[];

function load(){
  fetch(URL).then(r=>r.json()).then(d=>{
    items=d;
    render();
  });
}

function render(){
  list.innerHTML="";
  items.forEach((i,idx)=>{
    list.innerHTML+=`
      <div class="item">
        <b>${i.name || "غرض بدون اسم"} (رف ${i.shelf})</b>
        <div class="actions">
          ${i.image_url?`<button class="view" onclick="view(${idx})">👁️</button>`:""}
          <button class="edit" onclick="fill(${idx})">تعديل</button>
          <button class="delete" onclick="del(${idx})">حذف</button>
        </div>
      </div>
    `;
  });
}

function view(i){
  const it=items[i];
  modalBody.innerHTML=`
    <h3>${it.name||""}</h3>
    <p><b>التصنيف:</b> ${it.category}</p>
    <p><b>الرف:</b> ${it.shelf}</p>
    <p><b>الجهة:</b> ${it.side}</p>
    <p><b>المستوى:</b> ${it.level}</p>
    <p><b>المنطقة:</b> ${it.zone}</p>
    <p><b>ملاحظات:</b> ${it.notes}</p>
    <img src="${it.image_url}">
  `;
  modal.style.display="flex";
}

function closeModal(){
  modal.style.display="none";
}

function openGallery(){
  let html="<h2>📷 استعراض الصور</h2>";
  items.forEach(i=>{
    if(i.image_url){
      html+=`
        <div style="margin-bottom:15px">
          <b>${i.name||""} (رف ${i.shelf})</b><br>
          <img src="${i.image_url}" style="width:100%;border-radius:8px">
        </div>
      `;
    }
  });
  const w=window.open("");
  w.document.write(`<html><body style="font-family:tahoma">${html}</body></html>`);
}

function fill(i){
  const it=items[i];
  name.value=it.name;
  category.value=it.category;
  shelf.value=it.shelf;
  side.value=it.side;
  level.value=it.level;
  zone.value=it.zone;
  notes.value=it.notes;
}

function save(){
  const f=image.files[0];
  if(f){
    const r=new FileReader();
    r.onload=()=>send(r.result.split(",")[1],f);
    r.readAsDataURL(f);
  }else send();
}

function send(img,file){
  fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      name:name.value,
      category:category.value,
      shelf:shelf.value,
      side:side.value,
      level:level.value,
      zone:zone.value,
      notes:notes.value,
      image:img,
      imageName:file?.name,
      imageType:file?.type
    })
  }).then(()=>location.reload());
}

function del(i){
  if(!confirm("هل تريد الحذف؟"))return;
  fetch(URL,{
    method:"POST",
    body:JSON.stringify({action:"delete",row:i+2})
  }).then(()=>location.reload());
}

search.oninput=()=>{
  const v=search.value;
  list.innerHTML="";
  items.filter(i=>
    (i.name||"").includes(v) || (""+i.shelf).includes(v)
  ).forEach(()=>render());
};

load();
</script>

</body>
</html>
