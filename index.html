<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مستودع البيت</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, textarea, select, button { width: 100%; margin: 5px 0; padding: 8px; }
    button { cursor: pointer; }
    .item { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
    img { max-width: 100px; display: block; margin-top: 5px; }
  </style>
</head>
<body>

<h2>مستودع البيت</h2>

<input id="name" placeholder="اسم الغرض">
<input id="shelf" placeholder="رقم الرف">
<textarea id="notes" placeholder="ملاحظات"></textarea>
<input type="file" id="image">
<button onclick="saveItem()">حفظ</button>

<div id="list"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
    authDomain: "warehouse-house.firebaseapp.com",
    projectId: "warehouse-house",
    storageBucket: "warehouse-house.firebasestorage.app",
    messagingSenderId: "791378856906",
    appId: "1:791378856906:web:69aa95b1c53e2791865d33"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  async function saveItem() {
    const name = document.getElementById("name").value;
    const shelf = document.getElementById("shelf").value;
    const notes = document.getElementById("notes").value;
    const file = document.getElementById("image").files[0];

    let imageUrl = "";

    try {
      // ⬅️ إذا فيه صورة
      if (file) {
        const imageRef = ref(storage, "images/" + Date.now() + "_" + file.name);
        await uploadBytes(imageRef, file);
        imageUrl = await getDownloadURL(imageRef);
      }

      // ⬅️ الحفظ يتم دائمًا (سواء فيه صورة أو لا)
      await addDoc(collection(db, "items"), {
        name,
        shelf,
        notes,
        imageUrl,
        createdAt: new Date()
      });

      alert("تم الحفظ بنجاح ✅");
      loadItems();

    } catch (e) {
      alert("خطأ في الحفظ ❌");
      console.error(e);
    }
  }

  async function loadItems() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    const snapshot = await getDocs(collection(db, "items"));
    snapshot.forEach(doc => {
      const d = doc.data();
      list.innerHTML += `
        <div class="item">
          <b>${d.name}</b><br>
          رف: ${d.shelf}<br>
          ${d.notes || ""}
          ${d.imageUrl ? `<img src="${d.imageUrl}">` : ""}
        </div>
      `;
    });
  }

  loadItems();
</script>

</body>
</html>
