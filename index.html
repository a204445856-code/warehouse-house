<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>رفع صورة Firebase</title>
</head>
<body>

  <h2>رفع صورة (اختبار)</h2>

  <input type="file" id="image" />
  <br><br>
  <button id="uploadBtn">رفع الصورة</button>

  <p id="result"></p>

  <script type="module">
    // Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
      authDomain: "warehouse-house.firebaseapp.com",
      projectId: "warehouse-house",
      storageBucket: "warehouse-house.firebasestorage.app",
      messagingSenderId: "791378856906",
      appId: "1:791378856906:web:69aa95b1c53e2791865d33"
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    // ربط الزر
    const uploadBtn = document.getElementById("uploadBtn");
    const imageInput = document.getElementById("image");
    const result = document.getElementById("result");

    uploadBtn.addEventListener("click", async () => {
      const file = imageInput.files[0];

      if (!file) {
        alert("اختر صورة أولاً");
        return;
      }

      try {
        result.innerText = "⏳ جاري رفع الصورة...";

        const imageRef = ref(storage, "images/" + file.name);
        await uploadBytes(imageRef, file);

        const url = await getDownloadURL(imageRef);
        result.innerHTML = `
          ✅ تم رفع الصورة<br>
          <a href="${url}" target="_blank">عرض الصورة</a>
        `;
      } catch (error) {
        console.error(error);
        result.innerText = "❌ حصل خطأ أثناء الرفع";
      }
    });
  </script>

</body>
</html>
