<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مستودع البيت</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f6f7;
      margin:0;
      padding:0;
    }
    h1{
      text-align:center;
      padding:20px;
    }
    .container{
      display:flex;
      gap:15px;
      padding:15px;
      flex-wrap:wrap;
    }
    .card{
      background:#fff;
      border-radius:8px;
      padding:15px;
      box-shadow:0 2px 6px rgba(0,0,0,.1);
    }
    .form{
      flex:1;
      min-width:280px;
    }
    .list{
      flex:1;
      min-width:280px;
      max-height:80vh;
      overflow:auto;
    }
    input, textarea, button{
      width:100%;
      margin-bottom:10px;
      padding:8px;
      font-size:14px;
    }
    button{
      cursor:pointer;
      border:none;
      border-radius:5px;
    }
    .save{background:#2563eb;color:#fff}
    .delete{background:#ef4444;color:#fff}
    .edit{background:#f59e0b;color:#fff}
    .item{
      border:1px solid #ddd;
      padding:10px;
      border-radius:6px;
      margin-bottom:10px;
    }
    .item-title{
      font-weight:bold;
      margin-bottom:5px;
    }
    .row{
      display:flex;
      gap:5px;
    }
  </style>
</head>

<body>

<h1>📦 مستودع البيت</h1>

<div class="container">

  <div class="card form">
    <input id="name" placeholder="اسم الغرض">
    <input id="category" placeholder="التصنيف">
    <input id="shelf" type="number" placeholder="رقم الرف">
    <input id="side" placeholder="الجهة">
    <input id="level" placeholder="المستوى">
    <input id="zone" placeholder="المنطقة">
    <textarea id="notes" placeholder="ملاحظات"></textarea>

    <button class="save" onclick="saveItem()">حفظ</button>
  </div>

  <div class="card list" id="itemsList">جاري التحميل...</div>

</div>

<script>
const API_URL = "const SHEET_NAME = "items";

function doGet() {
  const sh = SpreadsheetApp.getActive().getSheetByName(SHEET_NAME);
  const data = sh.getDataRange().getValues();
  const headers = data.shift();

  const items = data.map(r=>{
    let o = {};
    headers.forEach((h,i)=>o[h]=r[i]);
    return o;
  });

  return ContentService
    .createTextOutput(JSON.stringify(items))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e){
  const sh = SpreadsheetApp.getActive().getSheetByName(SHEET_NAME);
  const body = JSON.parse(e.postData.contents);

  if(body.delete){
    const rows = sh.getDataRange().getValues();
    for(let i=1;i<rows.length;i++){
      if(rows[i][0]==body.id){
        sh.deleteRow(i+1);
        break;
      }
    }
    return ok();
  }

  const id = body.id || Date.now();

  const row = [
    id,
    body.name || "",
    body.category || "",
    body.shelf || "",
    body.side || "",
    body.level || "",
    body.zone || "",
    body.notes || "",
    new Date(),
    ""
  ];

  if(body.id){
    const rows = sh.getDataRange().getValues();
    for(let i=1;i<rows.length;i++){
      if(rows[i][0]==body.id){
        sh.getRange(i+1,1,1,row.length).setValues([row]);
        break;
      }
    }
  }else{
    sh.appendRow(row);
  }

  return ok();
}

function ok(){
  return ContentService.createTextOutput("ok");
}
";

let items = [];
let editId = null;

function loadItems(){
  fetch(API_URL)
    .then(r=>r.json())
    .then(d=>{
      items = d;
      render();
    });
}

function render(){
  const box = document.getElementById("itemsList");
  box.innerHTML = "";

  if(items.length === 0){
    box.innerHTML = "لا توجد أغراض";
    return;
  }

  items.slice().reverse().forEach(i=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="item-title">${i.name || "بدون اسم"} (رف ${i.shelf})</div>
      <div>${i.category || ""}</div>
      <div class="row">
        <button class="edit" onclick="editItem(${i.id})">تعديل</button>
        <button class="delete" onclick="deleteItem(${i.id})">حذف</button>
      </div>
    `;
    box.appendChild(div);
  });
}

function saveItem(){
  if(!name.value.trim()){
    alert("اكتب اسم الغرض");
    return;
  }

  const data = {
    id: editId,
    name: name.value,
    category: category.value,
    shelf: shelf.value,
    side: side.value,
    level: level.value,
    zone: zone.value,
    notes: notes.value
  };

  fetch(API_URL,{
    method:"POST",
    mode:"no-cors",
    body: JSON.stringify(data)
  });

  clearForm();
  setTimeout(loadItems, 2000);
}

function editItem(id){
  const i = items.find(x=>x.id==id);
  editId = id;
  name.value = i.name;
  category.value = i.category;
  shelf.value = i.shelf;
  side.value = i.side;
  level.value = i.level;
  zone.value = i.zone;
  notes.value = i.notes;
}

function deleteItem(id){
  if(!confirm("تأكيد الحذف؟")) return;

  fetch(API_URL,{
    method:"POST",
    mode:"no-cors",
    body: JSON.stringify({delete:true,id})
  });

  setTimeout(loadItems, 2000);
}

function clearForm(){
  editId = null;
  document.querySelectorAll("input,textarea").forEach(e=>e.value="");
}

loadItems();
</script>

</body>
</html>
