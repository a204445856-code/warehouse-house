<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f5f6f7;margin:0}
h1{text-align:center;padding:15px}
.container{display:flex;gap:15px;padding:15px;flex-wrap:wrap}
.card{background:#fff;border-radius:8px;padding:15px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.form,.list{flex:1;min-width:280px}
.item{border:1px solid #ddd;border-radius:6px;padding:10px;margin-bottom:10px}
img{max-width:100%;border-radius:6px;margin-top:5px}
button{padding:8px;border:none;border-radius:5px;cursor:pointer}
.save{background:#2563eb;color:#fff;width:100%}
.delete{background:#ef4444;color:#fff}
.edit{background:#f59e0b;color:#fff}
</style>
</head>

<body>

<h1>📦 مستودع البيت</h1>

<div class="container">

<div class="card form">
<input id="name" placeholder="اسم الغرض">
<input id="category" placeholder="التصنيف">
<input id="shelf" type="number" placeholder="رقم الرف">
<input id="side" placeholder="الجهة">
<input id="level" placeholder="المستوى">
<input id="zone" placeholder="المنطقة">
<textarea id="notes" placeholder="ملاحظات"></textarea>
<input type="file" id="image" accept="image/*">
<button class="save" onclick="save()">حفظ</button>
</div>

<div class="card list" id="list">جاري التحميل...</div>

</div>

<script>
const API_URL =https://script.google.com/macros/s/AKfycbxqI8JJl7TaPu_8R8mzWJMYML3baWLByr1xb4hetsdriUhGlvnD4JERCyNDtt9FLZw/exec;

let items=[], editId=null;

function load(){
 fetch(API_URL).then(r=>r.json()).then(d=>{
  items=d; render();
 });
}

function render(){
 const box=document.getElementById("list");
 box.innerHTML="";
 items.slice().reverse().forEach(i=>{
  box.innerHTML+=`
   <div class="item">
    <b>${i.name||"بدون اسم"}</b> (رف ${i.shelf||"-"})
    ${i.image_url?`<img src="${i.image_url}">`:""}
    <div>
     <button class="edit" onclick="edit(${i.id})">تعديل</button>
     <button class="delete" onclick="del(${i.id})">حذف</button>
    </div>
   </div>`;
 });
}

function save(){
 const file=document.getElementById("image").files[0];
 if(file){
  const r=new FileReader();
  r.onload=()=>send(r.result,file);
  r.readAsDataURL(file);
 }else send();
}

function send(img,file){
 fetch(API_URL,{
  method:"POST",
  body:JSON.stringify({
   id:editId,
   name:name.value,
   category:category.value,
   shelf:shelf.value,
   side:side.value,
   level:level.value,
   zone:zone.value,
   notes:notes.value,
   image:img||"",
   imageName:file?file.name:"",
   imageType:file?file.type:""
  })
 }).then(()=>{clear();load();});
}

function edit(id){
 const i=items.find(x=>x.id==id);
 editId=id;
 name.value=i.name;
 category.value=i.category;
 shelf.value=i.shelf;
 side.value=i.side;
 level.value=i.level;
 zone.value=i.zone;
 notes.value=i.notes;
}

function del(id){
 if(!confirm("حذف؟"))return;
 fetch(API_URL,{method:"POST",body:JSON.stringify({delete:true,id})})
 .then(load);
}

function clear(){
 editId=null;
 document.querySelectorAll("input,textarea").forEach(e=>e.value="");
}

load();
</script>

</body>
</html>
