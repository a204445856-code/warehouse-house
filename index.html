<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مستودع البيت</title>

<style>
body{
  font-family: Arial;
  background:#f5f6f7;
  padding:20px;
}
h2{text-align:center}
.container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
.card{
  background:#fff;
  padding:15px;
  border-radius:8px;
}
input, textarea, select, button{
  width:100%;
  padding:8px;
  margin:6px 0;
}
button{cursor:pointer}

#list{
  max-height:420px;
  overflow-y:auto;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:8px 0;
}
.item-right{
  display:flex;
  align-items:center;
  gap:6px;
}
.item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:4px;
}

.btn-edit{
  background:#f59e0b;
  color:#fff;
  border:none;
  padding:6px 8px;
  border-radius:4px;
}
.btn-delete{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:6px 8px;
  border-radius:4px;
}

#gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
  margin-top:10px;
}
#gallery img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>📦 مستودع البيت</h2>

<div class="container">

<div class="card">
<h3>إضافة / تعديل</h3>

<input id="name" placeholder="اسم الغرض *">

<label>رقم الرف *</label>
<select id="shelf"></select>

<label>المكان</label>
<select id="place">
  <option value="">-- اختر المكان --</option>
  <option>البدروم</option>
  <option>رف أيمن</option>
  <option>رف أيسر</option>
  <option>رف أمام</option>
  <option>المطبخ</option>
  <option>غرفة البنات</option>
  <option>غرفة الأولاد</option>
  <option>الصالة</option>
  <option>تحت المغسلة</option>
  <option>غرفتي</option>
  <option>استقبال</option>
  <option>استقبال البيت</option>
</select>

<textarea id="notes" placeholder="ملاحظات"></textarea>

<!-- مهم للجوال -->
<input type="file" id="image" accept="image/*" capture="environment">

<button type="button" id="saveBtn">💾 حفظ</button>
<button type="button" id="clearBtn">🧹 مسح</button>

<p id="msg"></p>
</div>

<div class="card">
<h3>المحتويات</h3>
<div id="list"></div>
</div>

</div>

<div class="card" style="margin-top:20px">
<h3>🖼️ استديو الصور</h3>
<div id="gallery"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

window.addEventListener("DOMContentLoaded",()=>{

const firebaseConfig = {
  apiKey: "AIzaSyAR9N2AkOv-pyEEWf4rE68vEgET7pBx83s",
  authDomain: "warehouse-house.firebaseapp.com",
  projectId: "warehouse-house",
  storageBucket: "warehouse-house.firebasestorage.app",
  messagingSenderId: "791378856906",
  appId: "1:791378856906:web:69aa95b1c53e2791865d33"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const nameInput=document.getElementById("name");
const shelfSelect=document.getElementById("shelf");
const placeSelect=document.getElementById("place");
const notesInput=document.getElementById("notes");
const imageInput=document.getElementById("image");
const list=document.getElementById("list");
const gallery=document.getElementById("gallery");
const msg=document.getElementById("msg");

let editId=null;
let cache=[];

/* الرفوف */
for(let i=1;i<=100;i++){
  const opt=document.createElement("option");
  opt.value=i;
  opt.textContent="رف "+i;
  shelfSelect.appendChild(opt);
}

/* ضغط وتحويل صورة الجوال */
async function compressImage(file){
  return new Promise(resolve=>{
    const img=new Image();
    const reader=new FileReader();

    reader.onload=e=>img.src=e.target.result;
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const max=800;
      const scale=Math.min(max/img.width,1);
      canvas.width=img.width*scale;
      canvas.height=img.height*scale;
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(b=>{
        resolve(new File([b],"photo.jpg",{type:"image/jpeg"}));
      },"image/jpeg",0.7);
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById("saveBtn").onclick=async()=>{
  try{
    if(!nameInput.value||!shelfSelect.value){
      msg.innerText="❌ الاسم ورقم الرف مطلوبين";
      return;
    }

    let imageUrl="";
    let file=imageInput.files[0];

    if(file){
      file=await compressImage(file);
      const imgRef=ref(storage,"images/"+Date.now()+"_"+file.name);
      await uploadBytes(imgRef,file);
      imageUrl=await getDownloadURL(imgRef);
    }

    const data={
      name:nameInput.value,
      shelf:shelfSelect.value,
      place:placeSelect.value,
      notes:notesInput.value,
      image:imageUrl
    };

    if(editId){
      const old=cache.find(x=>x.id===editId);
      await updateDoc(doc(db,"items",editId),imageUrl?data:{...data,image:old.image});
      editId=null;
    }else{
      await addDoc(collection(db,"items"),data);
    }

    clearForm();
    loadData();
    msg.innerText="✅ تم الحفظ";

  }catch(e){
    console.error(e);
    msg.innerText="❌ خطأ أثناء الحفظ";
  }
};

document.getElementById("clearBtn").onclick=clearForm;

function clearForm(){
  nameInput.value="";
  shelfSelect.value="";
  placeSelect.value="";
  notesInput.value="";
  imageInput.value="";
}

async function loadData(){
  list.innerHTML="";
  gallery.innerHTML="";
  cache=[];

  const snap=await getDocs(collection(db,"items"));
  snap.forEach(d=>{
    const x={id:d.id,...d.data()};
    cache.push(x);

    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <div>
        <b>${x.name}</b><br>
        رف ${x.shelf} - ${x.place||""}
      </div>
      <div class="item-right">
        ${x.image?`<img src="${x.image}" onclick="editItem('${x.id}')">`:""}
        <button class="btn-edit" onclick="editItem('${x.id}')">✏️</button>
        <button class="btn-delete" onclick="deleteItem('${x.id}')">🗑️</button>
      </div>`;
    list.appendChild(div);

    if(x.image){
      const img=document.createElement("img");
      img.src=x.image;
      img.onclick=()=>editItem(x.id);
      gallery.appendChild(img);
    }
  });
}

window.editItem=id=>{
  const x=cache.find(i=>i.id===id);
  if(!x)return;
  nameInput.value=x.name;
  shelfSelect.value=x.shelf;
  placeSelect.value=x.place;
  notesInput.value=x.notes;
  editId=id;
};

window.deleteItem=async id=>{
  if(confirm("حذف العنصر؟")){
    await deleteDoc(doc(db,"items",id));
    loadData();
  }
};

loadData();
});
</script>

</body>
</html>
